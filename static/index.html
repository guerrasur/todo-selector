<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo-Selector</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e26;
    --panel-2: #232733;
    --texto: #e8eaf0;
    --tenue: #8a92a6;
    --borde: #2d3240;
    --on: #22c55e;
    --off: #6b7280;
    --curso: #f59e0b;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--borde);
    padding: 14px 20px; display: flex; align-items: center; gap: 16px;
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: var(--panel-2); color: var(--tenue);
  }
  .badge.alerta { background: #422; color: #fca5a5; }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .categoria { margin: 26px 0 10px; font-size: 13px; letter-spacing: 1.2px;
               text-transform: uppercase; color: var(--tenue); }
  .item {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px;
    align-items: center;
  }
  .nombre { font-weight: 500; }
  .nombre.editable { cursor: text; }
  .nombre.editable:hover { text-decoration: underline dotted var(--tenue); }
  .plats { display: flex; gap: 8px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--borde);
    display: flex; align-items: center; gap: 6px; min-width: 108px;
    color: var(--tenue); cursor: pointer; opacity: .45;
    transition: opacity .12s, border-color .12s;
  }
  .pill.sel { opacity: 1; color: var(--texto); border-color: #4a5165; }
  .pill:hover { border-color: #5a6178; }
  .pill.na { opacity: .25; cursor: default; font-style: italic; }
  .pill.na:hover { border-color: var(--borde); }
  .punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-prendido { background: var(--on); }
  .p-apagado_hoy, .p-apagado_indefinido, .p-apagado_ajeno { background: var(--off); }
  .p-apagado_ajeno { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--off); }
  .p-apagando, .p-prendiendo { background: var(--curso); animation: late 1s infinite; }
  .p-fallo { background: var(--error); }
  .p-desconocido { background: #444; }
  @keyframes late { 50% { opacity: .3; } }
  .acciones { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px;
    border: 1px solid var(--borde); background: var(--panel-2);
    color: var(--texto); cursor: pointer;
  }
  button:hover { background: #2c3140; }
  button.on { border-color: #14532d; color: #86efac; }
  button.off { border-color: #431407; color: #fdba74; }
  .vacio { color: var(--tenue); padding: 40px; text-align: center; }
  /* Los pausados no se esconden, se corren del camino. */
  .item.pausado { opacity: .5; }
  .item.pausado:hover { opacity: .85; }
  button.pausa {
    background: transparent; border-color: transparent; color: var(--tenue);
    font-size: 12px; padding: 7px 8px;
  }
  button.pausa:hover { background: var(--panel-2); color: var(--texto); }
  /* Fila propia abajo del producto: .item es un grid de 3 columnas. */
  .detalle-fallo {
    grid-column: 1 / -1;
    font-size: 12px; color: var(--error); line-height: 1.4;
    word-break: break-word;
  }
  /* ---- Buscador ---- */
  #panel-busqueda {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  }
  #buscador {
    flex: 1; padding: 10px 12px; border-radius: 9px; font: inherit;
    border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
  }
  #buscador:focus {
    outline: none; border-color: #4a5165; background: var(--panel-2);
  }
  #buscador::-webkit-search-cancel-button { display: none; }
  #btn-limpiar { display: none; padding: 9px 12px; line-height: 1; }
  #panel-busqueda.buscando #btn-limpiar { display: block; }
  #resultado-busqueda { color: var(--tenue); font-size: 13px; white-space: nowrap; }

  .aviso {
    background: var(--panel); border: 1px solid #4a4020;
    border-left: 3px solid var(--curso);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px; justify-content: space-between;
  }
  .aviso.ok { border-color: var(--borde); border-left-color: var(--on); }

  /* ---- Pantalla Carta: lo que dicen los portales vs lo que hay cargado ---- */
  .carta { background: var(--panel); border: 1px solid var(--borde);
           border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .carta h2 { font-size: 15px; margin: 0 0 4px; }
  .carta .ayuda { color: var(--tenue); font-size: 13px; margin-bottom: 14px; }
  .grupo { margin-top: 18px; }
  .grupo > h3 { font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase;
                color: var(--tenue); margin: 0 0 8px; font-weight: 600; }
  .par { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px;
         align-items: center; padding: 8px 10px; border-radius: 8px;
         background: var(--panel-2); margin-bottom: 6px; font-size: 14px; }
  .par .lado { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .par .quien { font-size: 11px; color: var(--tenue); }
  .par .qué { overflow-wrap: anywhere; }
  .par .nada { color: var(--tenue); font-style: italic; }
  .par .alt { font-size: 11px; color: var(--curso); }
  .par .conf { font-size: 11px; color: var(--tenue); }
  .par.ok { border-left: 3px solid var(--on); }
  .par .hecho { color: var(--on); font-size: 12px; }
  .carta .cargando { color: var(--curso); }
</style>
</head>
<body>

<header>
  <h1>Todo-Selector</h1>
  <span class="badge" id="estado-sistema">cargando…</span>
  <span class="badge" id="pendientes"></span>
  <span class="badge" id="lectura"></span>
  <button id="btn-leer-estado" style="margin-left:auto">Leer estado real</button>
  <button id="btn-carta">Actualizar carta</button>
  <button id="btn-revalidar">Revalidar sesión</button>
</header>

<main>
  <div id="panel-busqueda">
    <input id="buscador" type="search" autocomplete="off"
           placeholder="Buscar un producto…  (por el nombre de cualquiera de los dos portales)">
    <button id="btn-limpiar" title="Borrar la búsqueda (Esc)">✕</button>
    <span id="resultado-busqueda"></span>
  </div>
  <div id="panel-novedades" style="display:none"></div>
  <div id="panel-carta" class="carta" style="display:none"></div>
  <div id="lista" class="vacio">Cargando productos…</div>
</main>

<script>
const PLATS = ['pedidosya', 'rappi'];
const NOMBRE_PLAT = { pedidosya: 'PedidosYa', rappi: 'Rappi' };

async function cargar() {
  const [productos, sistema, novedades] = await Promise.all([
    fetch('/api/productos').then(r => r.json()),
    fetch('/api/estado-sistema').then(r => r.json()),
    fetch('/api/novedades').then(r => r.json()).catch(() => ({ novedades: [] })),
  ]);

  pintarSistema(sistema);
  pintarNovedades(novedades.novedades || []);
  pintarProductos(productos);
}

// Algo que el catálogo tenía como "no existe en ese portal" y el portal
// ahora muestra: lo agregaste a la carta. Sin este aviso, la app lo seguía
// mostrando en gris y la única forma de enterarse era abrir la Carta.
function pintarNovedades(novedades) {
  const panel = document.getElementById('panel-novedades');
  if (!novedades.length) { panel.style.display = 'none'; return; }

  panel.style.display = 'block';
  panel.className = 'aviso';
  panel.innerHTML = '<div style="width:100%"></div>';
  const cont = panel.firstChild;

  const titulo = document.createElement('div');
  titulo.style.marginBottom = '8px';
  titulo.innerHTML = novedades.length === 1
    ? '<b>Un producto apareció en un portal donde no estaba.</b>'
    : `<b>${novedades.length} productos aparecieron en un portal donde no estaban.</b>`;
  cont.appendChild(titulo);

  for (const n of novedades) {
    const fila = document.createElement('div');
    fila.style.cssText = 'display:flex;gap:10px;align-items:center;' +
                         'justify-content:space-between;margin-top:6px';

    const texto = document.createElement('div');
    texto.innerHTML =
      `<b>${n.producto}</b> ahora también está en ${NOMBRE_PLAT[n.plataforma]}` +
      ` como <b>${n.nombre_en_el_portal}</b>`;

    const acc = document.createElement('div');
    acc.className = 'acciones';

    const bSi = document.createElement('button');
    bSi.className = 'on';
    bSi.textContent = 'Es el mismo';
    bSi.title = 'Que los dos se apaguen con el mismo botón';
    bSi.onclick = () => accionCarta('/api/vincular',
                                    { pedidosya: n.pedidosya, rappi: n.rappi }, bSi);

    const bNo = document.createElement('button');
    bNo.textContent = 'No, es otro';
    bNo.title = 'Dejarlo como está y no volver a avisar';
    bNo.onclick = () => accionCarta('/api/novedades/ignorar',
                                    { plataforma: n.plataforma,
                                      nombre_remoto: n.nombre_en_el_portal }, bNo);

    acc.append(bSi, bNo);
    fila.append(texto, acc);
    cont.appendChild(fila);
  }
}

function pintarSistema(s) {
  const el = document.getElementById('estado-sistema');
  if (s.simulado) {
    el.textContent = 'MODO SIMULADO';
    el.className = 'badge alerta';
  } else {
    const caidas = PLATS.filter(p => s.sesiones[p] === false);
    if (caidas.length) {
      el.textContent = 'Login pendiente: ' + caidas.map(p => NOMBRE_PLAT[p]).join(', ');
      el.className = 'badge alerta';
    } else {
      el.textContent = 'Conectado';
      el.className = 'badge';
    }
  }

  const p = document.getElementById('pendientes');
  p.textContent = s.operaciones_pendientes
    ? `${s.operaciones_pendientes} en cola` : '';

  // Cuando arranca, la lectura del estado real tarda un rato. Sin esto la
  // pantalla muestra todo en "sin leer" y parece que no funciona.
  const l = document.getElementById('lectura');
  if (s.simulado) {
    l.textContent = '';
  } else if (s.ultima_lectura) {
    l.textContent = 'estado leído ' + hora(s.ultima_lectura);
    l.className = 'badge';
  } else {
    l.textContent = 'leyendo el estado real…';
    l.className = 'badge alerta';
  }
}

function hora(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

// ---------------------------------------------------------------- Buscador
//
// La lista se repinta sola cada 3 segundos, así que el filtro NO puede vivir
// adentro de #lista: el input queda afuera para no perder el foco ni lo que
// estás tecleando mientras se refresca.

let filtro = '';

// Sin tildes y en minúsculas: buscar "clasica" tiene que encontrar "Clásica".
// El rango \u0300-\u036f son las marcas que NFD deja sueltas al separar la
// letra de su tilde.
function plano(texto) {
  return (texto || '').normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase();
}

function coincide(item) {
  if (!filtro) return true;
  // También por el nombre de cada portal: difieren tanto que buscar
  // "Villavicencio" tiene que llegar igual a "Agua con gas".
  const donde = [item.nombre, ...Object.values(item.alias || {})];
  return donde.some(t => plano(t).includes(filtro));
}

function aplicarFiltro(texto) {
  filtro = plano(texto.trim());
  document.getElementById('panel-busqueda')
          .classList.toggle('buscando', filtro !== '');
  cargar();
}

function pintarProductos(productos) {
  const cont = document.getElementById('lista');
  cont.className = '';
  cont.innerHTML = '';

  const total = productos.length;
  productos = productos.filter(coincide);

  document.getElementById('resultado-busqueda').textContent =
    filtro ? `${productos.length} de ${total}` : '';

  if (filtro && !productos.length) {
    cont.className = 'vacio';
    cont.textContent = 'No hay ningún producto que coincida.';
    return;
  }

  // Los pausados van al final y apagados de color: siguen en la carta del
  // portal pero este mes no se venden, y no tienen que estorbar arriba.
  const enUso = productos.filter(p => !p.pausado);
  const pausados = productos.filter(p => p.pausado);

  const porCategoria = {};
  for (const p of enUso) {
    (porCategoria[p.categoria] ||= []).push(p);
  }

  for (const [cat, items] of Object.entries(porCategoria)) {
    const h = document.createElement('div');
    h.className = 'categoria';
    h.textContent = cat;
    cont.appendChild(h);

    for (const item of items) {
      cont.appendChild(fila(item));
    }
  }

  if (!pausados.length) return;

  const h = document.createElement('div');
  h.className = 'categoria';
  h.innerHTML = `En pausa — ${pausados.length} ` +
    `<span style="text-transform:none;letter-spacing:0">` +
    `(siguen en la carta, pero la app no los sostiene)</span>`;
  cont.appendChild(h);

  for (const item of pausados) {
    const f = fila(item);
    f.classList.add('pausado');
    cont.appendChild(f);
  }
}

function fila(item) {
  const div = document.createElement('div');
  div.className = 'item';

  // El nombre es solo para vos: los portales se buscan por los alias. Al
  // separar dos que se llamaban igual queda uno con un sufijo feo, así que
  // tiene que poder arreglarse sin tocar código.
  const nombre = document.createElement('div');
  nombre.className = 'nombre editable';
  nombre.textContent = item.nombre;
  nombre.title = 'Click para cambiarle el nombre (solo cambia cómo lo ves acá)';
  nombre.onclick = async () => {
    const nuevo = prompt('¿Cómo querés que se llame?', item.nombre);
    if (nuevo === null || nuevo.trim() === '' || nuevo === item.nombre) return;
    const r = await fetch('/api/renombrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ producto_id: item.id, nombre: nuevo.trim() }),
    });
    if (!r.ok) {
      const detalle = await r.json().catch(() => ({}));
      alert('No se pudo: ' + (detalle.detail || r.status));
    }
    cargar();
  };
  div.appendChild(nombre);

  // Cada plataforma es un chip clickeable: define sobre cuales actuar
  const plats = document.createElement('div');
  plats.className = 'plats';
  const seleccion = new Set(PLATS);

  for (const plat of PLATS) {
    const est = item.estados[plat];

    // Si no hay estado, el producto no existe en esa plataforma
    if (!est) {
      const na = document.createElement('span');
      na.className = 'pill na';
      na.textContent = `${NOMBRE_PLAT[plat]}: —`;
      na.title = 'Este producto no existe en ' + NOMBRE_PLAT[plat];
      plats.appendChild(na);
      seleccion.delete(plat);
      continue;
    }

    const pill = document.createElement('button');
    pill.className = 'pill sel';
    pill.dataset.plat = plat;
    pill.title = (est.detalle || '') + '  (click para incluir/excluir)';
    pill.innerHTML =
      `<span class="punto p-${est.estado}"></span>` +
      `${NOMBRE_PLAT[plat]}: ${etiqueta(est.estado)}`;

    pill.onclick = () => {
      if (seleccion.has(plat)) {
        seleccion.delete(plat);
        pill.classList.remove('sel');
      } else {
        seleccion.add(plat);
        pill.classList.add('sel');
      }
      // Si no queda ninguna, deshabilitamos los botones
      const vacio = seleccion.size === 0;
      div.querySelectorAll('.acciones button').forEach(b => b.disabled = vacio);
    };

    plats.appendChild(pill);
  }
  div.appendChild(plats);

  // El motivo del fallo estaba solo en el tooltip: si algo falla, se ve.
  for (const plat of PLATS) {
    const est = item.estados[plat];
    if (!est || est.estado !== 'fallo' || !est.detalle) continue;
    const err = document.createElement('div');
    err.className = 'detalle-fallo';
    err.textContent = `${NOMBRE_PLAT[plat]}: ${est.detalle}`;
    div.appendChild(err);
  }

  const acc = document.createElement('div');
  acc.className = 'acciones';

  // Discreto a proposito: se usa una vez cada tanto, no tiene que competir
  // con los botones de todos los dias.
  const bPausa = document.createElement('button');
  bPausa.className = 'pausa';
  bPausa.textContent = item.pausado ? 'Reactivar' : 'Pausar';
  bPausa.title = item.pausado
    ? 'Volver a la lista de siempre'
    : 'Este mes no se vende: mandarlo al final y que la app no lo sostenga';
  bPausa.onclick = async () => {
    bPausa.disabled = true;
    await fetch('/api/pausar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ producto_id: item.id, pausado: !item.pausado }),
    });
    cargar();
  };
  acc.appendChild(bPausa);

  const bHoy = document.createElement('button');
  bHoy.className = 'off';
  bHoy.textContent = 'Apagar hoy';
  bHoy.onclick = () => accion(item.id, 'apagar_hoy', [...seleccion]);

  const bIndef = document.createElement('button');
  bIndef.className = 'off';
  bIndef.textContent = 'Indefinido';
  bIndef.onclick = () => accion(item.id, 'apagar_indef', [...seleccion]);

  const bOn = document.createElement('button');
  bOn.className = 'on';
  bOn.textContent = 'Prender';
  bOn.onclick = () => accion(item.id, 'prender', [...seleccion]);

  acc.append(bHoy, bIndef, bOn);
  div.appendChild(acc);

  return div;
}

function etiqueta(e) {
  return {
    prendido: 'disponible',
    apagando: 'apagando…',
    prendiendo: 'prendiendo…',
    apagado_hoy: 'apagado hoy',
    apagado_indefinido: 'apagado',
    // Apagado en el portal, no por la app. Se distingue porque la app no
    // lo sostiene: si el portal lo revive, no lo vuelve a apagar sola.
    apagado_ajeno: 'apagado (afuera)',
    fallo: 'FALLÓ',
    desconocido: 'sin leer',
  }[e] || e;
}

async function accion(producto_id, accion, plataformas) {
  if (!plataformas || !plataformas.length) return;
  await fetch('/api/accion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ producto_id, accion, plataformas }),
  });
  cargar();
}

// ---------------------------------------------------------------- Carta
//
// Muestra lo que dicen los dos portales y lo cruza con lo que hay cargado.
// Los emparejamientos dudosos quedan SEPARADOS: cada uno con su botón. Si
// son el mismo plato, "Vincular" los deja bajo un solo botón de apagado.

let carta = null;        // ultimo /api/carta
let catalogo = null;     // ultimo /api/catalogo

function panelCarta() { return document.getElementById('panel-carta'); }

async function abrirCarta() {
  const panel = panelCarta();
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';

  // Al abrir se muestra la última lectura guardada en el server: recargar el
  // navegador no tiene por qué costar otro minuto de leer los portales.
  if (!carta) {
    const guardada = await fetch('/api/carta?releer=false').then(r => r.json());
    if (!guardada.sin_lectura) carta = guardada;
  }
  await refrescarCarta();
}

async function refrescarCarta() {
  catalogo = await fetch('/api/catalogo').then(r => r.json());
  pintarCarta();
}

async function leerCarta() {
  const panel = panelCarta();
  panel.innerHTML = `<h2>Carta</h2>
    <div class="ayuda cargando">Leyendo los dos portales… tarda como un minuto:
    recorre todas las categorías de PedidosYa y la lista de Rappi.</div>`;
  try {
    carta = await fetch('/api/carta?releer=true').then(r => r.json());
  } catch (e) {
    panel.innerHTML = `<h2>Carta</h2><div class="ayuda">No pude leer: ${e}</div>`;
    return;
  }
  await refrescarCarta();
}

// Con que producto del catalogo se corresponde un nombre de portal
function productoDe(plataforma, remoto) {
  if (!catalogo) return null;
  return catalogo.productos.find(p => p.plataformas[plataforma] === remoto) || null;
}

function pintarCarta() {
  const panel = panelCarta();
  panel.innerHTML = `
    <h2>Carta</h2>
    <div class="ayuda">
      Lo que muestran los portales hoy, cruzado con lo que tiene cargado la app.
      Lo que no es claramente el mismo plato queda separado, con un botón cada uno.
    </div>
    <button id="btn-leer-carta">${carta ? 'Volver a leer los portales' : 'Leer los portales'}</button>
    <button id="btn-deshacer"${catalogo && catalogo.deshacer ? '' : ' disabled'}>
      ${catalogo && catalogo.deshacer
        ? 'Deshacer: ' + catalogo.deshacer : 'Nada para deshacer'}
    </button>
    <div id="carta-cuerpo"></div>`;
  document.getElementById('btn-leer-carta').onclick = leerCarta;
  document.getElementById('btn-deshacer').onclick = (e) =>
    accionCarta('/api/deshacer', {}, e.target);

  if (!carta) return;
  const cuerpo = document.getElementById('carta-cuerpo');
  cuerpo.appendChild(vinculadorManual());

  if (carta.error || carta.errores) {
    const aviso = document.createElement('div');
    aviso.className = 'ayuda';
    aviso.style.color = 'var(--error)';
    aviso.textContent = 'Lectura incompleta: ' +
      JSON.stringify(carta.errores || carta.error);
    cuerpo.appendChild(aviso);
  }

  cuerpo.appendChild(grupo(
    `A confirmar — ${(carta.a_confirmar || []).length}`,
    (carta.a_confirmar || []).map(filaPar)));

  cuerpo.appendChild(grupo(
    `Emparejados solos — ${(carta.pares || []).length}`,
    (carta.pares || []).map(filaPar)));

  cuerpo.appendChild(grupo(
    `Solo en PedidosYa — ${(carta.solo_pedidosya || []).length}`,
    (carta.solo_pedidosya || []).map(n => filaSuelto('pedidosya', n))));

  cuerpo.appendChild(grupo(
    `Solo en Rappi — ${(carta.solo_rappi || []).length}`,
    (carta.solo_rappi || []).map(n => filaSuelto('rappi', n))));

  if (carta.leidos) {
    const pie = document.createElement('div');
    pie.className = 'ayuda';
    pie.style.marginTop = '16px';
    pie.textContent = `Leídos: ${carta.leidos.pedidosya || 0} en PedidosYa, ` +
                      `${carta.leidos.rappi || 0} en Rappi` +
                      (carta.leida_en ? `, el ${carta.leida_en.replace('T', ' a las ')}.` : '.') +
                      (catalogo && catalogo.manual
                        ? ' El catálogo lo manejás vos desde acá.' : '');
    cuerpo.appendChild(pie);
  }
}

// Vincular dos cualesquiera, sin esperar a que la app los proponga. Es para
// los casos que ninguna heurística va a sacar: nombres que no se parecen en
// nada, o dos que la app emparejó con otra cosa.
function todosLosNombres(plataforma) {
  const nombres = new Set();
  const clave = plataforma === 'rappi' ? 'rappi' : 'pedidosya';
  for (const grupo of ['pares', 'a_confirmar']) {
    for (const par of (carta[grupo] || [])) {
      if (par[clave]) nombres.add(par[clave]);
    }
  }
  for (const n of (carta['solo_' + clave] || [])) nombres.add(n);
  return [...nombres].sort((a, b) => a.localeCompare(b, 'es'));
}

// Con qué está vinculado hoy ese nombre, si con algo. Vincularlo con otra
// cosa rompe ese vínculo, y eso tiene que verse ANTES de apretar el botón.
function vinculoActual(plataforma, remoto) {
  const producto = productoDe(plataforma, remoto);
  if (!producto) return null;
  const otra = plataforma === 'rappi' ? 'pedidosya' : 'rappi';
  return producto.plataformas[otra];
}

function vinculadorManual() {
  const div = document.createElement('div');
  div.className = 'grupo';
  div.innerHTML = `
    <h3>Vincular a mano</h3>
    <div class="ayuda">
      Si sabés que dos son el mismo plato y la app no lo propuso, elegilos acá.
      Si alguno ya estaba vinculado con otro, ese otro no se pierde: queda
      como producto suelto.
    </div>`;

  // 'manual' la distingue de las filas de la carta: esta contiene TODOS los
  // nombres adentro de los <select>, asi que buscar una fila por su texto la
  // encontraria siempre a ella.
  const fila = document.createElement('div');
  fila.className = 'par manual';

  const armar = (plataforma) => {
    const lado = document.createElement('div');
    lado.className = 'lado';
    const quien = document.createElement('div');
    quien.className = 'quien';
    quien.textContent = NOMBRE_PLAT[plataforma];
    const sel = document.createElement('select');
    sel.dataset.plat = plataforma;
    sel.style.cssText = 'width:100%;padding:6px 8px;border-radius:6px;' +
      'border:1px solid var(--borde);background:var(--bg);color:var(--texto);' +
      'font:inherit;font-size:13px';
    sel.innerHTML = '<option value="">— elegir —</option>' +
      todosLosNombres(plataforma).map(n => {
        const con = vinculoActual(plataforma, n);
        const etiqueta = con ? `${n}   → hoy va con «${con}»` : n;
        return `<option value="${n.replace(/"/g, '&quot;')}">${etiqueta}</option>`;
      }).join('');
    lado.append(quien, sel);
    sel.onchange = avisarDeLoQueRompe;
    return { lado, sel };
  };

  const py = armar('pedidosya');
  const rappi = armar('rappi');

  const acc = document.createElement('div');
  acc.className = 'acciones';
  const boton = document.createElement('button');
  boton.className = 'on';
  boton.textContent = 'Vincular';
  boton.onclick = () => {
    if (!py.sel.value || !rappi.sel.value) {
      alert('Elegí uno de cada portal.');
      return;
    }
    accionCarta('/api/vincular',
                { pedidosya: py.sel.value, rappi: rappi.sel.value }, boton);
  };
  acc.appendChild(boton);

  const aviso = document.createElement('div');
  aviso.className = 'ayuda';
  aviso.id = 'aviso-vinculo';
  aviso.style.cssText = 'grid-column:1/-1;margin:0;color:var(--curso)';

  function avisarDeLoQueRompe() {
    const sueltos = [];
    for (const [plat, sel] of [['pedidosya', py.sel], ['rappi', rappi.sel]]) {
      if (!sel.value) continue;
      const con = vinculoActual(plat, sel.value);
      const otra = plat === 'rappi' ? 'pedidosya' : 'rappi';
      const elegido = otra === 'rappi' ? rappi.sel.value : py.sel.value;
      if (con && con !== elegido) sueltos.push(`«${con}»`);
    }
    aviso.textContent = sueltos.length
      ? 'Ojo: al vincular estos dos, ' + sueltos.join(' y ') +
        ' se queda solo, con su propio botón. Si no lo usás, pausalo.'
      : '';
  }

  fila.append(py.lado, rappi.lado, acc, aviso);
  div.appendChild(fila);
  return div;
}

function grupo(titulo, filas) {
  const div = document.createElement('div');
  div.className = 'grupo';
  const h = document.createElement('h3');
  h.textContent = titulo;
  div.appendChild(h);
  if (!filas.length) {
    const vacio = document.createElement('div');
    vacio.className = 'ayuda';
    vacio.textContent = 'Nada.';
    div.appendChild(vacio);
  }
  filas.forEach(f => div.appendChild(f));
  return div;
}

function lado(plataforma, nombre, extra) {
  const d = document.createElement('div');
  d.className = 'lado';
  const quien = document.createElement('div');
  quien.className = 'quien';
  quien.textContent = NOMBRE_PLAT[plataforma];
  const qué = document.createElement('div');
  qué.className = nombre ? 'qué' : 'qué nada';
  qué.textContent = nombre || 'no está';
  d.append(quien, qué);
  if (extra) {
    const e = document.createElement('div');
    e.className = 'alt';
    e.textContent = extra;
    d.appendChild(e);
  }
  return d;
}

function filaPar(par) {
  const div = document.createElement('div');
  div.className = 'par';

  const pPy = productoDe('pedidosya', par.pedidosya);
  const pRappi = productoDe('rappi', par.rappi);
  const vinculado = pPy && pRappi && pPy.id === pRappi.id;
  if (vinculado) div.classList.add('ok');

  const alternativas = (par.alternativas || []).length
    ? 'ojo, también existe: ' + par.alternativas.join(' · ') : '';

  div.append(lado('pedidosya', par.pedidosya),
             lado('rappi', par.rappi, alternativas));

  const acc = document.createElement('div');
  acc.className = 'acciones';

  const conf = document.createElement('span');
  conf.className = 'conf';
  conf.textContent = par.confianza != null ? par.confianza.toFixed(2) : '';
  acc.appendChild(conf);

  if (vinculado) {
    const b = document.createElement('button');
    b.textContent = 'Separar';
    b.title = `Dejar "${par.pedidosya}" y "${par.rappi}" como dos productos`;
    b.onclick = () => accionCarta('/api/separar',
                                  { producto_id: pPy.id, plataforma: 'rappi' }, b);
    acc.append(etiquetaHecho('un solo botón'), b);
  } else {
    const b = document.createElement('button');
    b.className = 'on';
    b.textContent = 'Vincular';
    b.title = 'Que los dos se apaguen con el mismo botón';
    b.onclick = () => accionCarta('/api/vincular',
                                  { pedidosya: par.pedidosya, rappi: par.rappi }, b);
    acc.appendChild(b);
  }

  div.appendChild(acc);
  return div;
}

function filaSuelto(plataforma, nombre) {
  const div = document.createElement('div');
  div.className = 'par';
  const otra = plataforma === 'rappi' ? 'pedidosya' : 'rappi';

  div.append(lado(plataforma, nombre), lado(otra, null));

  const acc = document.createElement('div');
  acc.className = 'acciones';
  const cargado = productoDe(plataforma, nombre);

  if (cargado) {
    div.classList.add('ok');
    acc.appendChild(etiquetaHecho('cargado'));
  } else {
    const b = document.createElement('button');
    b.textContent = 'Agregar';
    b.title = 'Cargarlo en la app para poder apagarlo desde acá';
    b.onclick = () => accionCarta('/api/agregar',
                                  { plataforma, nombre_remoto: nombre }, b);
    acc.appendChild(b);
  }

  div.appendChild(acc);
  return div;
}

function etiquetaHecho(texto) {
  const s = document.createElement('span');
  s.className = 'hecho';
  s.textContent = texto;
  return s;
}

async function accionCarta(url, cuerpo, boton) {
  boton.disabled = true;
  const antes = boton.textContent;
  boton.textContent = '…';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    if (!r.ok) {
      const detalle = await r.json().catch(() => ({}));
      alert('No se pudo: ' + (detalle.detail || r.status));
      boton.disabled = false;
      boton.textContent = antes;
      return;
    }
    await refrescarCarta();
    await cargar();
  } catch (e) {
    alert('No se pudo: ' + e);
    boton.disabled = false;
    boton.textContent = antes;
  }
}

const buscador = document.getElementById('buscador');

buscador.oninput = () => aplicarFiltro(buscador.value);
buscador.onkeydown = (e) => { if (e.key === 'Escape') limpiarBusqueda(); };

function limpiarBusqueda() {
  buscador.value = '';
  aplicarFiltro('');
  buscador.focus();
}

document.getElementById('btn-limpiar').onclick = limpiarBusqueda;

document.getElementById('btn-carta').onclick = abrirCarta;

document.getElementById('btn-leer-estado').onclick = async (e) => {
  const b = e.target;
  b.disabled = true;
  b.textContent = 'Leyendo…';
  try {
    const r = await fetch('/api/sincronizar-estado', { method: 'POST' })
                    .then(r => r.json());
    const errores = Object.entries(r.resultado || {})
      .filter(([, v]) => v && v.error)
      .map(([plat, v]) => `${NOMBRE_PLAT[plat] || plat}: ${v.error}`);
    if (errores.length) alert('No pude leer todo:\n' + errores.join('\n'));
    await cargar();
  } finally {
    b.disabled = false;
    b.textContent = 'Leer estado real';
  }
};

document.getElementById('btn-revalidar').onclick = async (e) => {
  const b = e.target;
  b.disabled = true;
  b.textContent = 'Revalidando…';
  try {
    await fetch('/api/revalidar-sesion', { method: 'POST' });
    await cargar();
  } finally {
    b.disabled = false;
    b.textContent = 'Revalidar sesión';
  }
};

cargar();
setInterval(cargar, 3000);
</script>
