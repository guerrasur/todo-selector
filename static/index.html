<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo-Selector</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e26;
    --panel-2: #232733;
    --texto: #e8eaf0;
    --tenue: #8a92a6;
    --borde: #2d3240;
    --on: #22c55e;
    --off: #6b7280;
    --curso: #f59e0b;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--borde);
    padding: 14px 20px; display: flex; align-items: center; gap: 16px;
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: var(--panel-2); color: var(--tenue);
  }
  .badge.alerta { background: #422; color: #fca5a5; }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .categoria { margin: 26px 0 10px; font-size: 13px; letter-spacing: 1.2px;
               text-transform: uppercase; color: var(--tenue); }
  .item {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px;
    align-items: center;
  }
  .nombre { font-weight: 500; }
  .nombre.editable { cursor: text; }
  .nombre.editable:hover { text-decoration: underline dotted var(--tenue); }
  .plats { display: flex; gap: 8px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--borde);
    display: flex; align-items: center; gap: 6px; min-width: 108px;
    color: var(--tenue); cursor: pointer; opacity: .45;
    transition: opacity .12s, border-color .12s;
  }
  .pill.sel { opacity: 1; color: var(--texto); border-color: #4a5165; }
  .pill:hover { border-color: #5a6178; }
  .pill.na { opacity: .25; cursor: default; font-style: italic; }
  .pill.na:hover { border-color: var(--borde); }
  /* Excluida con un click: tiene que verse APAGADA, no apenas mas tenue.
     Con solo la opacidad no se notaba y el usuario no sabia sobre que
     portal iba a actuar el boton. */
  .pill:not(.sel):not(.na) {
    opacity: .5; text-decoration: line-through;
    text-decoration-color: var(--tenue); background: transparent;
  }
  .pill:not(.sel):not(.na) .punto { opacity: .35; }
  .punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-prendido { background: var(--on); }
  .p-apagado_hoy, .p-apagado_indefinido, .p-apagado_ajeno { background: var(--off); }
  .p-apagado_ajeno { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--off); }
  .p-apagando, .p-prendiendo { background: var(--curso); animation: late 1s infinite; }
  .p-fallo { background: var(--error); }
  .p-desconocido { background: #444; }
  @keyframes late { 50% { opacity: .3; } }
  .acciones { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px;
    border: 1px solid var(--borde); background: var(--panel-2);
    color: var(--texto); cursor: pointer;
  }
  button:hover { background: #2c3140; }
  button.on { border-color: #14532d; color: #86efac; }
  button.off { border-color: #431407; color: #fdba74; }
  .vacio { color: var(--tenue); padding: 40px; text-align: center; }
  /* Los pausados no se esconden, se corren del camino. */
  .item.pausado { opacity: .5; }
  .item.pausado:hover { opacity: .85; }
  button.pausa {
    background: transparent; border-color: transparent; color: var(--tenue);
    font-size: 12px; padding: 7px 8px;
  }
  button.pausa:hover { background: var(--panel-2); color: var(--texto); }
  /* Fila propia abajo del producto: .item es un grid de 3 columnas. */
  .detalle-fallo {
    grid-column: 1 / -1;
    font-size: 12px; color: var(--error); line-height: 1.4;
    word-break: break-word;
  }
  /* ---- Buscador ---- */
  #panel-busqueda {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  }
  #buscador {
    flex: 1; padding: 10px 12px; border-radius: 9px; font: inherit;
    border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
  }
  #buscador:focus {
    outline: none; border-color: #4a5165; background: var(--panel-2);
  }
  #buscador::-webkit-search-cancel-button { display: none; }
  #btn-limpiar { display: none; padding: 9px 12px; line-height: 1; }
  #panel-busqueda.buscando #btn-limpiar { display: block; }
  #resultado-busqueda { color: var(--tenue); font-size: 13px; white-space: nowrap; }

  .aviso {
    background: var(--panel); border: 1px solid #4a4020;
    border-left: 3px solid var(--curso);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px; justify-content: space-between;
  }
  .aviso.ok { border-color: var(--borde); border-left-color: var(--on); }
  /* Lo que la app afirma sin poder confirmarlo: es lo que puede costar
     plata (un pedido de algo que no hay). Va en rojo, no en amarillo. */
  .aviso.grave { border-color: #5a2020; border-left-color: var(--error); }
  .aviso.grave b { color: #fca5a5; }
  .pista {
    color: var(--tenue); font-size: 12.5px; margin: -6px 0 16px;
    line-height: 1.5;
  }
  .pista b { color: #aab2c5; font-weight: 500; }
  /* Un producto que la app da por apagado y no puede confirmar. */
  .item.dudoso { border-color: #5a2020; }
  .pill.dudoso { border-color: #5a2020; }
  .nota-dudosa {
    grid-column: 1 / -1; font-size: 12px; color: #fca5a5; line-height: 1.4;
  }

  /* ---- Pantalla Carta: lo que dicen los portales vs lo que hay cargado ---- */
  .carta { background: var(--panel); border: 1px solid var(--borde);
           border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .carta h2 { font-size: 15px; margin: 0 0 4px; }
  .carta .ayuda { color: var(--tenue); font-size: 13px; margin-bottom: 14px; }
  .grupo { margin-top: 18px; }
  .grupo > h3 { font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase;
                color: var(--tenue); margin: 0 0 8px; font-weight: 600; }
  .par { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px;
         align-items: center; padding: 8px 10px; border-radius: 8px;
         background: var(--panel-2); margin-bottom: 6px; font-size: 14px; }
  .par .lado { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .par .quien { font-size: 11px; color: var(--tenue); }
  .par .qué { overflow-wrap: anywhere; }
  .par .nada { color: var(--tenue); font-style: italic; }
  .par .alt { font-size: 11px; color: var(--curso); }
  .par .conf { font-size: 11px; color: var(--tenue); }
  .par.ok { border-left: 3px solid var(--on); }
  .par .hecho { color: var(--on); font-size: 12px; }
  .carta .cargando { color: var(--curso); }

  /* ---- Cierre: apagar/prender una plataforma entera ---- */
  .fila-cierre {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0; border-top: 1px solid var(--borde);
  }
  .fila-cierre:first-of-type { border-top: none; }
  .fila-cierre .quien-cierre { min-width: 96px; font-weight: 500; }
  .fila-cierre .cuantos { color: var(--tenue); font-size: 12px; }
  button.grande { padding: 9px 14px; }
  #resultado-cierre { font-size: 13px; margin-top: 12px; white-space: pre-line; }

  /* ---- Ajustes ---- */
  .ajuste {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 14px;
    align-items: center; padding: 10px 0; border-top: 1px solid var(--borde);
  }
  .ajuste:first-of-type { border-top: none; }
  .ajuste .ayuda-ajuste {
    grid-column: 1; font-size: 12px; color: var(--tenue); margin-top: 2px;
  }
  .ajuste .control { grid-row: 1 / span 2; display: flex;
                     align-items: center; gap: 8px; }
  .ajuste input[type="number"] { width: 84px; }
  .ajuste input[type="text"] { width: 160px; }
  .ajuste input[type="number"], .ajuste input[type="text"], .ajuste select {
    padding: 7px 9px; border-radius: 7px; font: inherit; font-size: 13px;
    border: 1px solid var(--borde); background: var(--bg); color: var(--texto);
  }
  .ajuste .unidad { color: var(--tenue); font-size: 12px; }
  .ajuste.cambiado { background: #1f2330; }
  .pie-ajustes {
    display: flex; align-items: center; gap: 10px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--borde);
  }
  #estado-ajustes { font-size: 13px; color: var(--tenue); }
</style>
</head>
<body>

<header>
  <h1>Todo-Selector</h1>
  <span class="badge" id="estado-sistema">cargando…</span>
  <span class="badge" id="pendientes"></span>
  <span class="badge" id="lectura"></span>
  <button id="btn-cierre" style="margin-left:auto">Apagar todo</button>
  <button id="btn-leer-estado">Leer estado real</button>
  <button id="btn-carta">Actualizar carta</button>
  <button id="btn-revalidar">Revalidar sesión</button>
  <button id="btn-ajustes" title="Ajustes">⚙</button>
</header>

<main>
  <div id="panel-busqueda">
    <input id="buscador" type="search" autocomplete="off"
           placeholder="Buscar un producto…  (por el nombre de cualquiera de los dos portales)">
    <button id="btn-limpiar" title="Borrar la búsqueda (Esc)">✕</button>
    <span id="resultado-busqueda"></span>
  </div>
  <div id="pista-chips" class="pista">
    Clickeá el chip <b>PedidosYa</b> o <b>Rappi</b> de un producto para sacarlo
    de la acción: el botón queda actuando sobre el otro portal solo. Sirve
    cuando hay que apagar en un portal antes que en el otro.
  </div>
  <div id="panel-alertas" style="display:none"></div>
  <div id="panel-novedades" style="display:none"></div>
  <div id="panel-cierre" class="carta" style="display:none"></div>
  <div id="panel-ajustes" class="carta" style="display:none"></div>
  <div id="panel-carta" class="carta" style="display:none"></div>
  <div id="lista" class="vacio">Cargando productos…</div>
</main>

<script>
const PLATS = ['pedidosya', 'rappi'];
const NOMBRE_PLAT = { pedidosya: 'PedidosYa', rappi: 'Rappi' };

// producto_id + '|' + plataforma  ->  por qué la app no puede confirmar que
// siga apagado. Lo usa fila() para marcar el producto.
let dudosos = new Map();

async function cargar() {
  const [productos, sistema, novedades, alertas] = await Promise.all([
    fetch('/api/productos').then(r => r.json()),
    fetch('/api/estado-sistema').then(r => r.json()),
    fetch('/api/novedades').then(r => r.json()).catch(() => ({ novedades: [] })),
    fetch('/api/alertas').then(r => r.json())
      .catch(() => ({ sin_confirmar: [], sesiones_caidas: [] })),
  ]);

  dudosos = new Map((alertas.sin_confirmar || [])
    .map(a => [a.producto_id + '|' + a.plataforma, a]));

  pintarSistema(sistema);
  pintarAlertas(alertas);
  pintarNovedades(novedades.novedades || []);
  pintarProductos(productos);
}

// Lo único que puede salir caro de verdad: que la pantalla diga "apagado"
// de algo que el portal está vendiendo. Pasó el 2026-07-28 con un wrap.
//
// La app no puede prometer que no vuelva a pasar (el portal revive cosas
// solo, y si no encuentra el producto no puede leerlo), pero sí puede dejar
// de afirmar en presente algo que no está viendo.
function pintarAlertas(alertas) {
  const panel = document.getElementById('panel-alertas');
  const caidas = alertas.sesiones_caidas || [];
  const dudas = alertas.sin_confirmar || [];

  if (!caidas.length && !dudas.length) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  panel.className = 'aviso grave';
  panel.innerHTML = '';
  const cont = document.createElement('div');
  cont.style.width = '100%';
  panel.appendChild(cont);

  if (caidas.length) {
    const t = document.createElement('div');
    t.style.marginBottom = dudas.length ? '10px' : '0';
    const b = document.createElement('b');
    b.textContent = 'Hay que loguearse en ' +
      caidas.map(p => NOMBRE_PLAT[p] || p).join(' y ') + '.';
    t.append(b, ' Andá a la ventana del navegador que abrió la app, ' +
                'logueate en esa pestaña y apretá «Revalidar sesión». ' +
                'Lo que hayas pedido queda encolado y sale solo: no se pierde.');
    cont.appendChild(t);
  }

  if (!dudas.length) return;

  const t = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = dudas.length === 1
    ? 'Hay 1 producto que figura apagado y no puedo confirmarlo.'
    : `Hay ${dudas.length} productos que figuran apagados y no puedo confirmarlos.`;
  t.append(b, ' Puede que el portal los esté vendiendo igual.');
  cont.appendChild(t);

  for (const d of dudas) {
    const fila = document.createElement('div');
    fila.style.cssText = 'margin-top:6px;font-size:13px;color:var(--tenue)';
    const nombre = document.createElement('b');
    nombre.style.color = 'var(--texto)';
    nombre.textContent = d.producto;
    fila.append(nombre, ` en ${NOMBRE_PLAT[d.plataforma]}: ` + (
      d.motivo === 'no_aparece'
        ? `la última lectura no lo encontró en el portal como ` +
          `«${d.nombre_remoto}» — puede que allá se llame distinto.`
        : `sin confirmar desde ${d.verificado_en
             ? hora(d.verificado_en) : 'nunca'}.`));
    cont.appendChild(fila);
  }

  const acc = document.createElement('div');
  acc.className = 'acciones';
  acc.style.marginTop = '12px';

  const bLeer = document.createElement('button');
  bLeer.textContent = 'Leer los portales ahora';
  bLeer.onclick = () => document.getElementById('btn-leer-estado').click();

  const bCarta = document.createElement('button');
  bCarta.textContent = 'Revisar los nombres en la Carta';
  bCarta.title = 'Si el portal lo llama distinto, se arregla vinculándolo ahí';
  bCarta.onclick = abrirCarta;

  acc.append(bLeer, bCarta);
  cont.appendChild(acc);
}

// Algo que el catálogo tenía como "no existe en ese portal" y el portal
// ahora muestra: lo agregaste a la carta. Sin este aviso, la app lo seguía
// mostrando en gris y la única forma de enterarse era abrir la Carta.
function pintarNovedades(novedades) {
  const panel = document.getElementById('panel-novedades');
  if (!novedades.length) { panel.style.display = 'none'; return; }

  panel.style.display = 'block';
  panel.className = 'aviso';
  panel.innerHTML = '<div style="width:100%"></div>';
  const cont = panel.firstChild;

  const titulo = document.createElement('div');
  titulo.style.marginBottom = '8px';
  titulo.innerHTML = novedades.length === 1
    ? '<b>Un producto apareció en un portal donde no estaba.</b>'
    : `<b>${novedades.length} productos aparecieron en un portal donde no estaban.</b>`;
  cont.appendChild(titulo);

  for (const n of novedades) {
    const fila = document.createElement('div');
    fila.style.cssText = 'display:flex;gap:10px;align-items:center;' +
                         'justify-content:space-between;margin-top:6px';

    // Los dos nombres vienen del portal: van por textContent, no por
    // innerHTML, o un producto con un < en el nombre rompe el aviso.
    const texto = document.createElement('div');
    const cual = document.createElement('b');
    cual.textContent = n.producto;
    const comoAlla = document.createElement('b');
    comoAlla.textContent = n.nombre_en_el_portal;
    texto.append(cual,
                 ` ahora también está en ${NOMBRE_PLAT[n.plataforma]} como `,
                 comoAlla);

    const acc = document.createElement('div');
    acc.className = 'acciones';

    const bSi = document.createElement('button');
    bSi.className = 'on';
    bSi.textContent = 'Es el mismo';
    bSi.title = 'Que los dos se apaguen con el mismo botón';
    bSi.onclick = () => accionCarta('/api/vincular',
                                    { pedidosya: n.pedidosya, rappi: n.rappi }, bSi);

    const bNo = document.createElement('button');
    bNo.textContent = 'No, es otro';
    bNo.title = 'Dejarlo como está y no volver a avisar';
    bNo.onclick = () => accionCarta('/api/novedades/ignorar',
                                    { plataforma: n.plataforma,
                                      nombre_remoto: n.nombre_en_el_portal }, bNo);

    acc.append(bSi, bNo);
    fila.append(texto, acc);
    cont.appendChild(fila);
  }
}

function pintarSistema(s) {
  const el = document.getElementById('estado-sistema');
  if (s.simulado) {
    el.textContent = 'MODO SIMULADO';
    el.className = 'badge alerta';
  } else {
    const caidas = PLATS.filter(p => s.sesiones[p] === false);
    if (caidas.length) {
      el.textContent = 'Login pendiente: ' + caidas.map(p => NOMBRE_PLAT[p]).join(', ');
      el.className = 'badge alerta';
    } else {
      el.textContent = 'Conectado';
      el.className = 'badge';
    }
  }

  const p = document.getElementById('pendientes');
  p.textContent = s.operaciones_pendientes
    ? `${s.operaciones_pendientes} en cola` : '';

  // Cuando arranca, la lectura del estado real tarda un rato. Sin esto la
  // pantalla muestra todo en "sin leer" y parece que no funciona.
  const l = document.getElementById('lectura');
  if (s.simulado) {
    l.textContent = '';
  } else if (s.ultima_lectura) {
    l.textContent = 'estado leído ' + hora(s.ultima_lectura);
    l.className = 'badge';
  } else {
    l.textContent = 'leyendo el estado real…';
    l.className = 'badge alerta';
  }
}

function hora(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

// ---------------------------------------------------------------- Buscador
//
// La lista se repinta sola cada 3 segundos, así que el filtro NO puede vivir
// adentro de #lista: el input queda afuera para no perder el foco ni lo que
// estás tecleando mientras se refresca.

let filtro = '';

// producto_id -> Set de plataformas que sacaste de la selección con un click
// en el chip. Vive acá afuera para que el repintado automático no te la
// borre: ver el comentario largo en fila().
const excluidas = new Map();

// Sin tildes y en minúsculas: buscar "clasica" tiene que encontrar "Clásica".
// El rango \u0300-\u036f son las marcas que NFD deja sueltas al separar la
// letra de su tilde.
function plano(texto) {
  return (texto || '').normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase();
}

function coincide(item) {
  if (!filtro) return true;
  // También por el nombre de cada portal: difieren tanto que buscar
  // "Villavicencio" tiene que llegar igual a "Agua con gas".
  const donde = [item.nombre, ...Object.values(item.alias || {})];
  return donde.some(t => plano(t).includes(filtro));
}

function aplicarFiltro(texto) {
  filtro = plano(texto.trim());
  document.getElementById('panel-busqueda')
          .classList.toggle('buscando', filtro !== '');
  cargar();
}

function pintarProductos(productos) {
  const cont = document.getElementById('lista');
  cont.className = '';
  cont.innerHTML = '';

  const total = productos.length;
  productos = productos.filter(coincide);

  document.getElementById('resultado-busqueda').textContent =
    filtro ? `${productos.length} de ${total}` : '';

  if (filtro && !productos.length) {
    cont.className = 'vacio';
    cont.textContent = 'No hay ningún producto que coincida.';
    return;
  }

  // Los pausados van al final y apagados de color: siguen en la carta del
  // portal pero este mes no se venden, y no tienen que estorbar arriba.
  const enUso = productos.filter(p => !p.pausado);
  const pausados = productos.filter(p => p.pausado);

  // Los que se agregan desde la pantalla Carta vienen sin categoría, y el
  // título quedaba en blanco: una franja vacía arriba de un grupo de
  // productos, que parecía un error de la pantalla.
  const porCategoria = {};
  for (const p of enUso) {
    (porCategoria[p.categoria || 'Sin categoría'] ||= []).push(p);
  }

  for (const [cat, items] of Object.entries(porCategoria)) {
    const h = document.createElement('div');
    h.className = 'categoria';
    h.textContent = cat;
    cont.appendChild(h);

    for (const item of items) {
      cont.appendChild(fila(item));
    }
  }

  if (!pausados.length) return;

  const h = document.createElement('div');
  h.className = 'categoria';
  h.innerHTML = `En pausa — ${pausados.length} ` +
    `<span style="text-transform:none;letter-spacing:0">` +
    `(siguen en la carta, pero la app no los sostiene)</span>`;
  cont.appendChild(h);

  for (const item of pausados) {
    const f = fila(item);
    f.classList.add('pausado');
    cont.appendChild(f);
  }
}

function fila(item) {
  const div = document.createElement('div');
  div.className = 'item';

  // El nombre es solo para vos: los portales se buscan por los alias. Al
  // separar dos que se llamaban igual queda uno con un sufijo feo, así que
  // tiene que poder arreglarse sin tocar código.
  const nombre = document.createElement('div');
  nombre.className = 'nombre editable';
  nombre.textContent = item.nombre;
  nombre.title = 'Click para cambiarle el nombre (solo cambia cómo lo ves acá)';
  nombre.onclick = async () => {
    const nuevo = prompt('¿Cómo querés que se llame?', item.nombre);
    if (nuevo === null || nuevo.trim() === '' || nuevo === item.nombre) return;
    const r = await fetch('/api/renombrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ producto_id: item.id, nombre: nuevo.trim() }),
    });
    if (!r.ok) {
      const detalle = await r.json().catch(() => ({}));
      alert('No se pudo: ' + (detalle.detail || r.status));
    }
    cargar();
  };
  div.appendChild(nombre);

  // Cada plataforma es un chip clickeable: define sobre cuales actuar.
  //
  // La selección vive en `excluidas` (afuera de esta función) y NO en una
  // variable local. Tiene que ser así porque la lista se repinta sola cada
  // pocos segundos: con la selección local, excluías PedidosYa, tardabas
  // más que el refresco en apretar el botón, y el chip volvía a quedar
  // seleccionado sin que se notara. El click terminaba apagando en los DOS
  // portales, que es exactamente lo contrario de lo que habías pedido.
  const plats = document.createElement('div');
  plats.className = 'plats';
  const fuera = excluidas.get(item.id) || new Set();
  const seleccion = new Set();

  for (const plat of PLATS) {
    const est = item.estados[plat];

    // Si no hay estado, el producto no existe en esa plataforma
    if (!est) {
      const na = document.createElement('span');
      na.className = 'pill na';
      na.textContent = `${NOMBRE_PLAT[plat]}: —`;
      na.title = 'Este producto no existe en ' + NOMBRE_PLAT[plat];
      plats.appendChild(na);
      continue;
    }

    if (!fuera.has(plat)) seleccion.add(plat);

    // Si la app da esto por apagado pero no lo puede confirmar, no puede
    // seguir diciendo "apagado hoy" como si fuera un hecho de ahora.
    const duda = dudosos.get(item.id + '|' + plat);

    const pill = document.createElement('button');
    pill.className = 'pill' + (fuera.has(plat) ? '' : ' sel') +
                     (duda ? ' dudoso' : '');
    pill.dataset.plat = plat;
    pill.title = (est.detalle || '') + '  (click para incluir/excluir)';
    pill.innerHTML =
      `<span class="punto p-${est.estado}"></span>` +
      `${NOMBRE_PLAT[plat]}: ${etiqueta(est.estado)}` +
      (duda ? ' <span style="color:#fca5a5">(?)</span>' : '');

    pill.onclick = () => {
      if (seleccion.has(plat)) {
        seleccion.delete(plat);
        fuera.add(plat);
        pill.classList.remove('sel');
      } else {
        seleccion.add(plat);
        fuera.delete(plat);
        pill.classList.add('sel');
      }
      // Solo se recuerdan las filas donde sacaste algo: si están las dos,
      // no hay nada que guardar y el mapa no crece al pedo.
      if (fuera.size) excluidas.set(item.id, fuera);
      else excluidas.delete(item.id);

      refrescarBotones();
    };

    plats.appendChild(pill);
  }
  div.appendChild(plats);

  // Cuántas plataformas tiene este producto: si tiene una sola, aclarar
  // "solo Rappi" en el botón no informa nada, es ruido.
  const enCuantas = PLATS.filter(p => item.estados[p]).length;

  // El botón dice sobre qué portal va a actuar. Antes solo decía "Apagar
  // hoy" y para saber a dónde iba había que interpretar la opacidad de los
  // chips: el usuario no tenía forma de saber que se podía apagar en un
  // solo portal, y esa era justamente la función que pedía.
  function refrescarBotones() {
    const vacio = seleccion.size === 0;
    const solo = (enCuantas > 1 && seleccion.size === 1)
      ? ' · solo ' + NOMBRE_PLAT[[...seleccion][0]] : '';

    for (const b of div.querySelectorAll('.acciones button:not(.pausa)')) {
      b.disabled = vacio;
      b.textContent = b.dataset.etiqueta + solo;
      b.title = vacio
        ? 'Sacaste los dos portales: volvé a clickear un chip para incluirlo'
        : 'Actúa sobre ' + [...seleccion].map(p => NOMBRE_PLAT[p]).join(' y ');
    }
  }

  // El motivo del fallo estaba solo en el tooltip: si algo falla, se ve.
  for (const plat of PLATS) {
    const est = item.estados[plat];
    if (!est || est.estado !== 'fallo' || !est.detalle) continue;
    const err = document.createElement('div');
    err.className = 'detalle-fallo';
    err.textContent = `${NOMBRE_PLAT[plat]}: ${est.detalle}`;
    div.appendChild(err);
  }

  // Y lo mismo con el apagado que no se puede confirmar, que es peor que un
  // fallo: un fallo se ve en rojo, esto se veía como si estuviera todo bien.
  for (const plat of PLATS) {
    const duda = dudosos.get(item.id + '|' + plat);
    if (!duda) continue;
    div.classList.add('dudoso');
    const nota = document.createElement('div');
    nota.className = 'nota-dudosa';
    nota.textContent = `${NOMBRE_PLAT[plat]}: figura apagado, pero ` + (
      duda.motivo === 'no_aparece'
        ? `la última lectura no encontró «${duda.nombre_remoto}» en el ` +
          `portal, así que no puedo confirmarlo. Puede estar vendiéndose.`
        : `sin confirmar desde ${duda.verificado_en
             ? hora(duda.verificado_en) : 'nunca'}.`);
    div.appendChild(nota);
  }

  const acc = document.createElement('div');
  acc.className = 'acciones';

  // Discreto a proposito: se usa una vez cada tanto, no tiene que competir
  // con los botones de todos los dias.
  const bPausa = document.createElement('button');
  bPausa.className = 'pausa';
  bPausa.textContent = item.pausado ? 'Reactivar' : 'Pausar';
  bPausa.title = item.pausado
    ? 'Volver a la lista de siempre'
    : 'Este mes no se vende: mandarlo al final y que la app no lo sostenga';
  bPausa.onclick = async () => {
    bPausa.disabled = true;
    await fetch('/api/pausar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ producto_id: item.id, pausado: !item.pausado }),
    });
    cargar();
  };
  acc.appendChild(bPausa);

  const bHoy = document.createElement('button');
  bHoy.className = 'off';
  bHoy.dataset.etiqueta = 'Apagar hoy';
  bHoy.onclick = () => accion(item.id, 'apagar_hoy', [...seleccion]);

  const bIndef = document.createElement('button');
  bIndef.className = 'off';
  bIndef.dataset.etiqueta = 'Indefinido';
  bIndef.onclick = () => accion(item.id, 'apagar_indef', [...seleccion]);

  const bOn = document.createElement('button');
  bOn.className = 'on';
  bOn.dataset.etiqueta = 'Prender';
  bOn.onclick = () => accion(item.id, 'prender', [...seleccion]);

  acc.append(bHoy, bIndef, bOn);
  div.appendChild(acc);

  // Deja las etiquetas y el disabled como corresponda. Corre también en
  // cada repintado, no solo al clickear un chip.
  refrescarBotones();

  return div;
}

function etiqueta(e) {
  return {
    prendido: 'disponible',
    apagando: 'apagando…',
    prendiendo: 'prendiendo…',
    apagado_hoy: 'apagado hoy',
    apagado_indefinido: 'apagado',
    // Apagado en el portal, no por la app. Se distingue porque la app no
    // lo sostiene: si el portal lo revive, no lo vuelve a apagar sola.
    apagado_ajeno: 'apagado (afuera)',
    fallo: 'FALLÓ',
    desconocido: 'sin leer',
  }[e] || e;
}

async function accion(producto_id, accion, plataformas) {
  if (!plataformas || !plataformas.length) return;
  await fetch('/api/accion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ producto_id, accion, plataformas }),
  });
  cargar();
}

// ---------------------------------------------------------------- Cierre
//
// Apagar (o prender) la carta entera de UNA plataforma o de las dos. Cada
// portal tiene su propio botón a propósito: a veces hay que apagar PedidosYa
// antes que Rappi, y con un solo botón "apagar todo" eso no se podía.

function panelCierre() { return document.getElementById('panel-cierre'); }

async function abrirCierre() {
  const panel = panelCierre();
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  cerrarPaneles();
  panel.style.display = 'block';
  await pintarCierre();
}

// Cuánto tocaría cada botón, para que el número esté a la vista antes de
// apretar y no recién en la confirmación.
async function contarCierre(accion) {
  try {
    const r = await fetch('/api/masivo/previo?accion=' + accion)
                    .then(r => r.json());
    return r.por_plataforma || {};
  } catch (e) {
    return {};
  }
}

// `mensaje` es el resumen de lo que se acaba de encolar. Va acá y no se
// escribe después de repintar: entre el repintado y el restore el panel
// quedaba un instante en blanco, y eso es lo único que el usuario mira
// para saber si su click hizo algo.
async function pintarCierre(mensaje = '') {
  const panel = panelCierre();
  panel.innerHTML = `
    <h2>Apagar todo</h2>
    <div class="ayuda">
      Apaga o prende la carta entera de un portal. Podés hacer uno solo:
      la cola respeta el orden en que apretás, así que si PedidosYa tiene
      que apagarse antes que Rappi, apretá PedidosYa y después Rappi.
      <br>Salteo lo que ya está como quiere quedar, lo que está en pausa y
      lo que ya está en la cola. Se puede cambiar en Ajustes.
    </div>
    <div id="filas-cierre"></div>
    <div id="resultado-cierre"></div>`;
  document.getElementById('resultado-cierre').textContent = mensaje;

  const cont = document.getElementById('filas-cierre');
  const [paraApagar, paraPrender] = await Promise.all([
    contarCierre('apagar_hoy'), contarCierre('prender'),
  ]);

  const destinos = [
    ['pedidosya', 'PedidosYa', ['pedidosya']],
    ['rappi', 'Rappi', ['rappi']],
    ['ambas', 'Los dos', ['pedidosya', 'rappi']],
  ];

  for (const [clave, titulo, plats] of destinos) {
    const fila = document.createElement('div');
    fila.className = 'fila-cierre';
    fila.dataset.destino = clave;

    const quien = document.createElement('div');
    quien.className = 'quien-cierre';
    quien.textContent = titulo;
    fila.appendChild(quien);

    const suma = (cuentas) =>
      plats.reduce((t, p) => t + (cuentas[p] || 0), 0);

    const bApagar = document.createElement('button');
    bApagar.className = 'off grande';
    bApagar.textContent = 'Apagar todo';
    bApagar.onclick = () => correrMasivo('apagar', plats, titulo, bApagar);

    const bPrender = document.createElement('button');
    bPrender.className = 'on grande';
    bPrender.textContent = 'Prender todo';
    bPrender.onclick = () => correrMasivo('prender', plats, titulo, bPrender);

    const cuenta = document.createElement('span');
    cuenta.className = 'cuantos';
    cuenta.textContent =
      `${suma(paraApagar)} para apagar · ${suma(paraPrender)} para prender`;

    fila.append(bApagar, bPrender, cuenta);
    cont.appendChild(fila);
  }
}

// `que` es 'apagar' o 'prender'. El tipo de apagado (por hoy / indefinido)
// sale de Ajustes: al cierre siempre se usa el mismo y preguntarlo cada vez
// es una decisión de más en el momento en que menos ganas hay de decidir.
async function correrMasivo(que, plats, titulo, boton) {
  const opciones = await fetch('/api/config').then(r => r.json());
  const cfg = {};
  for (const o of opciones.opciones) cfg[o.clave] = o.valor;

  const accion = que === 'prender' ? 'prender' : cfg.cierre_accion;
  const cuentas = await contarCierre(accion);
  const total = plats.reduce((t, p) => t + (cuentas[p] || 0), 0);

  if (!total) {
    document.getElementById('resultado-cierre').textContent =
      `No hay nada para ${que} en ${titulo}: ya está todo como querés.`;
    return;
  }

  const comoApaga = accion === 'apagar_indef'
    ? 'apagado indefinido' : 'apagado por hoy';
  const detalle = que === 'prender'
    ? `Prender ${total} producto(s) en ${titulo}.`
    : `Apagar ${total} producto(s) en ${titulo} (${comoApaga}).`;

  if (!confirm(detalle + '\n\nVa producto por producto, así que tarda un ' +
               'rato. ¿Sigo?')) return;

  boton.disabled = true;
  const antes = boton.textContent;
  boton.textContent = cfg.cierre_releer ? 'Leyendo el portal…' : 'Encolando…';
  const salida = document.getElementById('resultado-cierre');
  salida.textContent = '';

  try {
    const r = await fetch('/api/masivo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, plataformas: plats }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      salida.textContent = 'No se pudo: ' + (err.detail || r.status);
      boton.disabled = false;
      boton.textContent = antes;
      return;
    }
    const { resultado } = await r.json();
    const resumen = PLATS
      .filter(p => resultado[p])
      .map(p => {
        const d = resultado[p];
        const error = d.lectura && d.lectura.error
          ? `  (no pude releer el portal: ${d.lectura.error})` : '';
        return `${NOMBRE_PLAT[p]}: ${d.total} encoladas, ` +
               `${d.salteados.length} salteadas.${error}`;
      })
      .join('\n');

    // Los números de arriba ya no valen: lo que acabo de encolar sale de la
    // cuenta. Se repinta con el resumen adentro, de una sola vez, así el
    // panel nunca se ve vacío. El botón vuelve solo, es uno nuevo.
    await pintarCierre(resumen);
    await cargar();
    return;
  } catch (e) {
    salida.textContent = 'No se pudo: ' + e;
  }

  // Solo se llega acá si no se repintó (error): hay que devolver el botón.
  boton.disabled = false;
  boton.textContent = antes;
}

// ---------------------------------------------------------------- Ajustes

function panelAjustes() { return document.getElementById('panel-ajustes'); }

async function abrirAjustes() {
  const panel = panelAjustes();
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  cerrarPaneles();
  panel.style.display = 'block';
  await pintarAjustes();
}

// La pantalla no sabe qué ajustes existen: los dibuja de lo que devuelve
// /api/config (tipo, ayuda, límites). Agregar uno es tocar app/config.py
// y nada más.
async function pintarAjustes() {
  const panel = panelAjustes();
  panel.innerHTML = `<h2>Ajustes</h2>
    <div class="ayuda cargando">Cargando…</div>`;

  let opciones;
  try {
    opciones = (await fetch('/api/config').then(r => r.json())).opciones;
  } catch (e) {
    panel.innerHTML = `<h2>Ajustes</h2>
      <div class="ayuda">No pude leerlos: ${e}</div>`;
    return;
  }

  panel.innerHTML = `<h2>Ajustes</h2>
    <div class="ayuda">Se guardan en la base, que vive afuera de la carpeta
      de la app: un autoupdate no se los lleva puestos.</div>
    <div id="cuerpo-ajustes"></div>
    <div class="pie-ajustes">
      <button id="btn-guardar-ajustes" class="on">Guardar</button>
      <button id="btn-restablecer">Volver a los valores por defecto</button>
      <span id="estado-ajustes"></span>
    </div>`;

  const cuerpo = document.getElementById('cuerpo-ajustes');
  const grupos = {};
  for (const o of opciones) (grupos[o.grupo] ||= []).push(o);

  for (const [nombre, items] of Object.entries(grupos)) {
    const div = document.createElement('div');
    div.className = 'grupo';
    const h = document.createElement('h3');
    h.textContent = nombre;
    div.appendChild(h);
    for (const o of items) div.appendChild(filaAjuste(o));
    cuerpo.appendChild(div);
  }

  document.getElementById('btn-guardar-ajustes').onclick = guardarAjustes;
  document.getElementById('btn-restablecer').onclick = restablecerAjustes;
}

function filaAjuste(o) {
  const div = document.createElement('div');
  div.className = 'ajuste';

  const titulo = document.createElement('div');
  titulo.textContent = o.titulo;
  div.appendChild(titulo);

  const control = document.createElement('div');
  control.className = 'control';

  let campo;
  if (o.tipo === 'bool') {
    campo = document.createElement('input');
    campo.type = 'checkbox';
    campo.checked = !!o.valor;
    campo.style.cssText = 'width:18px;height:18px;accent-color:#22c55e';
  } else if (o.tipo === 'eleccion') {
    campo = document.createElement('select');
    for (const op of o.opciones) {
      const item = document.createElement('option');
      item.value = op.valor;
      item.textContent = op.etiqueta;   // textContent: nada de innerHTML acá
      campo.appendChild(item);
    }
    campo.value = o.valor;
  } else if (o.tipo === 'entero') {
    campo = document.createElement('input');
    campo.type = 'number';
    if (o.minimo !== null) campo.min = o.minimo;
    if (o.maximo !== null) campo.max = o.maximo;
    campo.value = o.valor;
  } else {
    campo = document.createElement('input');
    campo.type = 'text';
    campo.value = o.valor;
  }

  campo.dataset.clave = o.clave;
  campo.dataset.tipo = o.tipo;
  // Que se vea cuál tocaste antes de guardar: son ajustes que cambian cómo
  // se comporta el navegador, no un formulario cualquiera.
  campo.oninput = () => div.classList.add('cambiado');
  campo.onchange = () => div.classList.add('cambiado');
  control.appendChild(campo);

  if (o.unidad) {
    const u = document.createElement('span');
    u.className = 'unidad';
    u.textContent = o.unidad;
    control.appendChild(u);
  }
  div.appendChild(control);

  if (o.ayuda) {
    const ayuda = document.createElement('div');
    ayuda.className = 'ayuda-ajuste';
    ayuda.textContent = o.ayuda;
    div.appendChild(ayuda);
  }
  return div;
}

function leerAjustes() {
  const cambios = {};
  for (const campo of document.querySelectorAll('#cuerpo-ajustes [data-clave]')) {
    cambios[campo.dataset.clave] =
      campo.dataset.tipo === 'bool' ? campo.checked :
      campo.dataset.tipo === 'entero' ? Number(campo.value) : campo.value;
  }
  return cambios;
}

async function guardarAjustes() {
  const boton = document.getElementById('btn-guardar-ajustes');
  const estado = document.getElementById('estado-ajustes');
  boton.disabled = true;
  estado.textContent = 'Guardando…';
  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cambios: leerAjustes() }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      estado.textContent = 'No se pudo: ' + (err.detail || r.status);
      return;
    }
    await pintarAjustes();
    document.getElementById('estado-ajustes').textContent = 'Guardado.';
    aplicarRefresco();
  } catch (e) {
    estado.textContent = 'No se pudo: ' + e;
  } finally {
    boton.disabled = false;
  }
}

async function restablecerAjustes() {
  if (!confirm('¿Volver todos los ajustes a los valores por defecto?')) return;
  await fetch('/api/config/restablecer', { method: 'POST' });
  await pintarAjustes();
  document.getElementById('estado-ajustes').textContent =
    'Listo, quedaron como venían de fábrica.';
  aplicarRefresco();
}

// ---------------------------------------------------------------- Carta
//
// Muestra lo que dicen los dos portales y lo cruza con lo que hay cargado.
// Los emparejamientos dudosos quedan SEPARADOS: cada uno con su botón. Si
// son el mismo plato, "Vincular" los deja bajo un solo botón de apagado.

let carta = null;        // ultimo /api/carta
let catalogo = null;     // ultimo /api/catalogo

function panelCarta() { return document.getElementById('panel-carta'); }

// Los tres paneles de arriba (cierre, ajustes, carta) son grandes y se
// turnan: dos abiertos a la vez empujan la lista fuera de la pantalla.
function cerrarPaneles(salvo) {
  for (const id of ['panel-cierre', 'panel-ajustes', 'panel-carta']) {
    if (id !== salvo) document.getElementById(id).style.display = 'none';
  }
}

async function abrirCarta() {
  const panel = panelCarta();
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  cerrarPaneles();
  panel.style.display = 'block';

  // Al abrir se muestra la última lectura guardada en el server: recargar el
  // navegador no tiene por qué costar otro minuto de leer los portales.
  if (!carta) {
    const guardada = await fetch('/api/carta?releer=false').then(r => r.json());
    if (!guardada.sin_lectura) carta = guardada;
  }
  await refrescarCarta();
}

async function refrescarCarta() {
  catalogo = await fetch('/api/catalogo').then(r => r.json());
  pintarCarta();
}

async function leerCarta() {
  const panel = panelCarta();
  panel.innerHTML = `<h2>Carta</h2>
    <div class="ayuda cargando">Leyendo los dos portales… tarda como un minuto:
    recorre todas las categorías de PedidosYa y la lista de Rappi.</div>`;
  try {
    carta = await fetch('/api/carta?releer=true').then(r => r.json());
  } catch (e) {
    panel.innerHTML = `<h2>Carta</h2><div class="ayuda">No pude leer: ${e}</div>`;
    return;
  }
  await refrescarCarta();
}

// Con que producto del catalogo se corresponde un nombre de portal
function productoDe(plataforma, remoto) {
  if (!catalogo) return null;
  return catalogo.productos.find(p => p.plataformas[plataforma] === remoto) || null;
}

function pintarCarta() {
  const panel = panelCarta();
  panel.innerHTML = `
    <h2>Carta</h2>
    <div class="ayuda">
      Lo que muestran los portales hoy, cruzado con lo que tiene cargado la app.
      Lo que no es claramente el mismo plato queda separado, con un botón cada uno.
    </div>
    <button id="btn-leer-carta">${carta ? 'Volver a leer los portales' : 'Leer los portales'}</button>
    <button id="btn-deshacer"${catalogo && catalogo.deshacer ? '' : ' disabled'}>
      ${catalogo && catalogo.deshacer
        ? 'Deshacer: ' + catalogo.deshacer : 'Nada para deshacer'}
    </button>
    <div id="carta-cuerpo"></div>`;
  document.getElementById('btn-leer-carta').onclick = leerCarta;
  document.getElementById('btn-deshacer').onclick = (e) =>
    accionCarta('/api/deshacer', {}, e.target);

  if (!carta) return;
  const cuerpo = document.getElementById('carta-cuerpo');
  cuerpo.appendChild(vinculadorManual());

  if (carta.error || carta.errores) {
    const aviso = document.createElement('div');
    aviso.className = 'ayuda';
    aviso.style.color = 'var(--error)';
    aviso.textContent = 'Lectura incompleta: ' +
      JSON.stringify(carta.errores || carta.error);
    cuerpo.appendChild(aviso);
  }

  cuerpo.appendChild(grupo(
    `A confirmar — ${(carta.a_confirmar || []).length}`,
    (carta.a_confirmar || []).map(filaPar)));

  cuerpo.appendChild(grupo(
    `Emparejados solos — ${(carta.pares || []).length}`,
    (carta.pares || []).map(filaPar)));

  cuerpo.appendChild(grupo(
    `Solo en PedidosYa — ${(carta.solo_pedidosya || []).length}`,
    (carta.solo_pedidosya || []).map(n => filaSuelto('pedidosya', n))));

  cuerpo.appendChild(grupo(
    `Solo en Rappi — ${(carta.solo_rappi || []).length}`,
    (carta.solo_rappi || []).map(n => filaSuelto('rappi', n))));

  if (carta.leidos) {
    const pie = document.createElement('div');
    pie.className = 'ayuda';
    pie.style.marginTop = '16px';
    pie.textContent = `Leídos: ${carta.leidos.pedidosya || 0} en PedidosYa, ` +
                      `${carta.leidos.rappi || 0} en Rappi` +
                      (carta.leida_en ? `, el ${carta.leida_en.replace('T', ' a las ')}.` : '.') +
                      (catalogo && catalogo.manual
                        ? ' El catálogo lo manejás vos desde acá.' : '');
    cuerpo.appendChild(pie);
  }
}

// Vincular dos cualesquiera, sin esperar a que la app los proponga. Es para
// los casos que ninguna heurística va a sacar: nombres que no se parecen en
// nada, o dos que la app emparejó con otra cosa.
function todosLosNombres(plataforma) {
  const nombres = new Set();
  const clave = plataforma === 'rappi' ? 'rappi' : 'pedidosya';
  for (const grupo of ['pares', 'a_confirmar']) {
    for (const par of (carta[grupo] || [])) {
      if (par[clave]) nombres.add(par[clave]);
    }
  }
  for (const n of (carta['solo_' + clave] || [])) nombres.add(n);
  return [...nombres].sort((a, b) => a.localeCompare(b, 'es'));
}

// Con qué está vinculado hoy ese nombre, si con algo. Vincularlo con otra
// cosa rompe ese vínculo, y eso tiene que verse ANTES de apretar el botón.
function vinculoActual(plataforma, remoto) {
  const producto = productoDe(plataforma, remoto);
  if (!producto) return null;
  const otra = plataforma === 'rappi' ? 'pedidosya' : 'rappi';
  return producto.plataformas[otra];
}

function vinculadorManual() {
  const div = document.createElement('div');
  div.className = 'grupo';
  div.innerHTML = `
    <h3>Vincular a mano</h3>
    <div class="ayuda">
      Si sabés que dos son el mismo plato y la app no lo propuso, elegilos acá.
      Si alguno ya estaba vinculado con otro, ese otro no se pierde: queda
      como producto suelto.
    </div>`;

  // 'manual' la distingue de las filas de la carta: esta contiene TODOS los
  // nombres adentro de los <select>, asi que buscar una fila por su texto la
  // encontraria siempre a ella.
  const fila = document.createElement('div');
  fila.className = 'par manual';

  const armar = (plataforma) => {
    const lado = document.createElement('div');
    lado.className = 'lado';
    const quien = document.createElement('div');
    quien.className = 'quien';
    quien.textContent = NOMBRE_PLAT[plataforma];
    const sel = document.createElement('select');
    sel.dataset.plat = plataforma;
    sel.style.cssText = 'width:100%;padding:6px 8px;border-radius:6px;' +
      'border:1px solid var(--borde);background:var(--bg);color:var(--texto);' +
      'font:inherit;font-size:13px';
    // Con DOM y no con innerHTML: los nombres los escribe el portal, y uno
    // con comillas o con un < rompía el <select> entero.
    const vacia = document.createElement('option');
    vacia.value = '';
    vacia.textContent = '— elegir —';
    sel.appendChild(vacia);
    for (const n of todosLosNombres(plataforma)) {
      const con = vinculoActual(plataforma, n);
      const op = document.createElement('option');
      op.value = n;
      op.textContent = con ? `${n}   → hoy va con «${con}»` : n;
      sel.appendChild(op);
    }
    lado.append(quien, sel);
    sel.onchange = avisarDeLoQueRompe;
    return { lado, sel };
  };

  const py = armar('pedidosya');
  const rappi = armar('rappi');

  const acc = document.createElement('div');
  acc.className = 'acciones';
  const boton = document.createElement('button');
  boton.className = 'on';
  boton.textContent = 'Vincular';
  boton.onclick = () => {
    if (!py.sel.value || !rappi.sel.value) {
      alert('Elegí uno de cada portal.');
      return;
    }
    accionCarta('/api/vincular',
                { pedidosya: py.sel.value, rappi: rappi.sel.value }, boton);
  };
  acc.appendChild(boton);

  const aviso = document.createElement('div');
  aviso.className = 'ayuda';
  aviso.id = 'aviso-vinculo';
  aviso.style.cssText = 'grid-column:1/-1;margin:0;color:var(--curso)';

  function avisarDeLoQueRompe() {
    const sueltos = [];
    for (const [plat, sel] of [['pedidosya', py.sel], ['rappi', rappi.sel]]) {
      if (!sel.value) continue;
      const con = vinculoActual(plat, sel.value);
      const otra = plat === 'rappi' ? 'pedidosya' : 'rappi';
      const elegido = otra === 'rappi' ? rappi.sel.value : py.sel.value;
      if (con && con !== elegido) sueltos.push(`«${con}»`);
    }
    aviso.textContent = sueltos.length
      ? 'Ojo: al vincular estos dos, ' + sueltos.join(' y ') +
        ' se queda solo, con su propio botón. Si no lo usás, pausalo.'
      : '';
  }

  fila.append(py.lado, rappi.lado, acc, aviso);
  div.appendChild(fila);
  return div;
}

function grupo(titulo, filas) {
  const div = document.createElement('div');
  div.className = 'grupo';
  const h = document.createElement('h3');
  h.textContent = titulo;
  div.appendChild(h);
  if (!filas.length) {
    const vacio = document.createElement('div');
    vacio.className = 'ayuda';
    vacio.textContent = 'Nada.';
    div.appendChild(vacio);
  }
  filas.forEach(f => div.appendChild(f));
  return div;
}

function lado(plataforma, nombre, extra) {
  const d = document.createElement('div');
  d.className = 'lado';
  const quien = document.createElement('div');
  quien.className = 'quien';
  quien.textContent = NOMBRE_PLAT[plataforma];
  const qué = document.createElement('div');
  qué.className = nombre ? 'qué' : 'qué nada';
  qué.textContent = nombre || 'no está';
  d.append(quien, qué);
  if (extra) {
    const e = document.createElement('div');
    e.className = 'alt';
    e.textContent = extra;
    d.appendChild(e);
  }
  return d;
}

function filaPar(par) {
  const div = document.createElement('div');
  div.className = 'par';

  const pPy = productoDe('pedidosya', par.pedidosya);
  const pRappi = productoDe('rappi', par.rappi);
  const vinculado = pPy && pRappi && pPy.id === pRappi.id;
  if (vinculado) div.classList.add('ok');

  const alternativas = (par.alternativas || []).length
    ? 'ojo, también existe: ' + par.alternativas.join(' · ') : '';

  div.append(lado('pedidosya', par.pedidosya),
             lado('rappi', par.rappi, alternativas));

  const acc = document.createElement('div');
  acc.className = 'acciones';

  const conf = document.createElement('span');
  conf.className = 'conf';
  conf.textContent = par.confianza != null ? par.confianza.toFixed(2) : '';
  acc.appendChild(conf);

  if (vinculado) {
    const b = document.createElement('button');
    b.textContent = 'Separar';
    b.title = `Dejar "${par.pedidosya}" y "${par.rappi}" como dos productos`;
    b.onclick = () => accionCarta('/api/separar',
                                  { producto_id: pPy.id, plataforma: 'rappi' }, b);
    acc.append(etiquetaHecho('un solo botón'), b);
  } else {
    const b = document.createElement('button');
    b.className = 'on';
    b.textContent = 'Vincular';
    b.title = 'Que los dos se apaguen con el mismo botón';
    b.onclick = () => accionCarta('/api/vincular',
                                  { pedidosya: par.pedidosya, rappi: par.rappi }, b);
    acc.appendChild(b);
  }

  div.appendChild(acc);
  return div;
}

function filaSuelto(plataforma, nombre) {
  const div = document.createElement('div');
  div.className = 'par';
  const otra = plataforma === 'rappi' ? 'pedidosya' : 'rappi';

  div.append(lado(plataforma, nombre), lado(otra, null));

  const acc = document.createElement('div');
  acc.className = 'acciones';
  const cargado = productoDe(plataforma, nombre);

  if (cargado) {
    div.classList.add('ok');
    acc.appendChild(etiquetaHecho('cargado'));
  } else {
    const b = document.createElement('button');
    b.textContent = 'Agregar';
    b.title = 'Cargarlo en la app para poder apagarlo desde acá';
    b.onclick = () => accionCarta('/api/agregar',
                                  { plataforma, nombre_remoto: nombre }, b);
    acc.appendChild(b);
  }

  div.appendChild(acc);
  return div;
}

function etiquetaHecho(texto) {
  const s = document.createElement('span');
  s.className = 'hecho';
  s.textContent = texto;
  return s;
}

async function accionCarta(url, cuerpo, boton) {
  boton.disabled = true;
  const antes = boton.textContent;
  boton.textContent = '…';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    if (!r.ok) {
      const detalle = await r.json().catch(() => ({}));
      alert('No se pudo: ' + (detalle.detail || r.status));
      boton.disabled = false;
      boton.textContent = antes;
      return;
    }
    await refrescarCarta();
    await cargar();
  } catch (e) {
    alert('No se pudo: ' + e);
    boton.disabled = false;
    boton.textContent = antes;
  }
}

const buscador = document.getElementById('buscador');

buscador.oninput = () => aplicarFiltro(buscador.value);
buscador.onkeydown = (e) => { if (e.key === 'Escape') limpiarBusqueda(); };

function limpiarBusqueda() {
  buscador.value = '';
  aplicarFiltro('');
  buscador.focus();
}

document.getElementById('btn-limpiar').onclick = limpiarBusqueda;

document.getElementById('btn-carta').onclick = abrirCarta;
document.getElementById('btn-cierre').onclick = abrirCierre;
document.getElementById('btn-ajustes').onclick = abrirAjustes;

document.getElementById('btn-leer-estado').onclick = async (e) => {
  const b = e.target;
  b.disabled = true;
  b.textContent = 'Leyendo…';
  try {
    const r = await fetch('/api/sincronizar-estado', { method: 'POST' })
                    .then(r => r.json());
    const errores = Object.entries(r.resultado || {})
      .filter(([, v]) => v && v.error)
      .map(([plat, v]) => `${NOMBRE_PLAT[plat] || plat}: ${v.error}`);
    if (errores.length) alert('No pude leer todo:\n' + errores.join('\n'));
    await cargar();
  } finally {
    b.disabled = false;
    b.textContent = 'Leer estado real';
  }
};

document.getElementById('btn-revalidar').onclick = async (e) => {
  const b = e.target;
  b.disabled = true;
  b.textContent = 'Revalidando…';
  try {
    await fetch('/api/revalidar-sesion', { method: 'POST' });
    await cargar();
  } finally {
    b.disabled = false;
    b.textContent = 'Revalidar sesión';
  }
};

// Cada cuánto se repinta la lista. Sale de Ajustes; 3 segundos es el
// default de siempre, y se usa también si /api/config no contesta.
let temporizador = null;

async function aplicarRefresco() {
  let segundos = 3;
  try {
    const { opciones } = await fetch('/api/config').then(r => r.json());
    const o = opciones.find(o => o.clave === 'refresco_pantalla');
    if (o && o.valor > 0) segundos = o.valor;
  } catch (e) { /* con el default alcanza */ }

  if (temporizador) clearInterval(temporizador);
  temporizador = setInterval(cargar, segundos * 1000);
}

cargar();
aplicarRefresco();
</script>
