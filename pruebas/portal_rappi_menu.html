<!doctype html>
<meta charset="utf-8">
<title>Replica del menu de Rappi</title>
<!--
  Replica del MENU de Rappi (no de Conectividad, que ya tiene la suya en
  portal_rappi_conectividad.html). Reproduce las cuatro trampas que el log
  del 2026-08-03 dejo ver:

    1. La franja `menu-categories-hoverable-gap-N`: un overlay invisible que
       cubre la lista y se come TODOS los clicks sobre los toggles. Es lo
       que hacia que el click normal fallara siempre en Rappi.
    2. El header pegajoso de categoria (`collapsible-panel-header`), que
       tambien aparecio interceptando.
    3. Un "Sólo por hoy" INVISIBLE en el DOM ademas del real del modal. El
       log mostro `count=1, visible=False`: el `.first` agarraba el
       fantasma porque el modal todavia no habia montado el de verdad.
    4. Nombres ambiguos: uno que aparece dos veces DENTRO de una tarjeta
       (inofensivo) y otro que aparece en DOS tarjetas (peligroso).

  Y con ?dialogo=portal, la quinta, que es la del 2026-08-03: el dialogo
  NO es un modal con el texto tal cual, sino un portal de floating-ui con
  opciones `menu-item-availability-switch-option-N` cuyo texto NO coincide
  caracter por caracter con el nuestro ("Solo por hoy", sin tilde) y trae
  una segunda linea de aclaracion. Con eso, buscar el texto exacto no
  encuentra nada, el dialogo queda abierto y el intento siguiente arranca
  con el popup tapando el toggle.

  Con ?tapa=ancestro, las tres del 2026-08-05, que son otras y juntas
  explican el "no apaga y se queda trabada":

    6. El que tapa el toggle es un ANCESTRO suyo: el
       <ul data-testid="menu-categories"> con un ::after que cubre la lista.
       elementFromPoint contesta el <ul> (los pseudo-elementos se reportan
       como el elemento que los origina), que es exactamente el
       "encima=ul[data-testid=menu-categories]" del log. La franja del punto
       1 es un HERMANO y se resuelve distinto: a un ancestro no se le pueden
       sacar los clicks de una, porque pointer-events se hereda y el toggle
       se quedaria sin ellos.
    7. El popup de disponibilidad se abre SOLO con pointerdown sobre el
       <span> de adentro del <label>. Un .click() disparado en el label no
       lo abre: por eso prender andaba (lo dispara el `change` del <input>)
       y apagar no abria el dialogo nunca.
    8. El <label> trae for="switch-hidden-input" y TODOS los productos tienen
       un input con ese mismo id. El for= resuelve al PRIMERO del documento,
       asi que activar el label por JS puede terminar tocando el switch de
       otro producto. Apagar el plato equivocado es el peor error posible.
-->
<style>
  body { font-family: sans-serif; margin: 0; }

  /* El header de categoria, pegajoso como en el portal real. */
  [data-testid="collapsible-panel-header"] {
    position: sticky; top: 0; height: 44px; line-height: 44px;
    padding: 0 12px; background: #eee; z-index: 5; cursor: pointer;
  }

  /* LA TRAMPA PRINCIPAL: la franja de hover. Invisible, sin nada que
     clickear, y encima de todo. Es exactamente lo que el log reporto como
     "intercepts pointer events". */
  [data-testid^="menu-categories-hoverable-gap"] {
    position: fixed; left: 0; right: 0; top: 44px; bottom: 0;
    z-index: 50;                      /* arriba de las tarjetas */
    background: transparent;
  }

  .tarjeta { display: flex; align-items: center; gap: 12px;
             padding: 14px 12px; border-bottom: 1px solid #eee; }
  .nombre { flex: 1; }
  .rotulo { color: #999; font-size: 11px; }

  label[data-testid$="availability-switch-control"] {
    position: relative; display: inline-block;
    width: 36px; height: 22px; border-radius: 12px;
    background: #bbb; cursor: pointer;
  }
  label[data-testid$="availability-switch-control"].on { background: #2b7; }
  #switch-hidden-input, .oculto-real {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0);
  }

  /* El fantasma del punto 3: esta en el DOM y no se ve. */
  .fantasma { display: none; }

  .portal { position: fixed; inset: 0; z-index: 900;
            background: rgba(0,0,0,.35); }
  .modal { position: fixed; top: 25%; left: 50%; transform: translateX(-50%);
           background: #fff; padding: 20px; border-radius: 8px; z-index: 901;
           min-width: 320px; }
  .modal div[data-testid="test-typography"] { padding: 8px 4px; cursor: pointer; }
  .modal button { margin-top: 12px; padding: 8px 14px; }

  /* El popup de floating-ui: sin fondo oscuro, pero igual tapa la pantalla
     entera con su contenedor, como en el portal real. */
  .portal-flotante { position: fixed; inset: 0; z-index: 900; }
  .portal-flotante .popup {
    position: absolute; top: 120px; right: 24px; width: 280px;
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.2);
  }
  .portal-flotante [data-testid^="menu-item-availability-switch-option"] {
    padding: 10px 8px; cursor: pointer;
  }

  /* ---- ?tapa=ancestro: los dos que tapan siendo ANCESTROS del toggle ----
     Los dos son pseudo-elementos, que es de donde salia el estorbo real:
     elementFromPoint los reporta como el elemento que los origina, y por eso
     el log decia "encima=ul[data-testid=menu-categories]" — un ancestro del
     propio toggle.

     Son dos a proposito, con z-index distintos, porque cada uno prueba una
     defensa:
       - el del <ul>, que esta en SELECTORES_ESTORBO: lo apaga
         neutralizar_estorbos() al preparar la pagina;
       - el de .cat-cuerpo, que NO esta en ninguna lista: ese lo tiene que
         resolver el peldaño de "destapar" de base.clickear(), que es el que
         sirve cuando el portal cambia el DOM otra vez. */
  ul[data-testid="menu-categories"] {
    list-style: none; margin: 0; padding: 0; position: relative;
  }
  ul[data-testid="menu-categories"]::after {
    content: ''; position: absolute; inset: 0; z-index: 45;
  }
  .cat-cuerpo { position: relative; }
  .cat-cuerpo::before {
    content: ''; position: absolute; inset: 0; z-index: 40;
  }

  /* ---- ?tapa=muchos: MAS capas decorativas que el limite viejo ----
     El log del 2026-08-05 destapo tres ancestros (ul[data-testid=
     menu-categories], div.sc-izEbhJ, div.sc-izEbhJ) y el toggle seguia
     tapado: el limite de 3 era un numero inventado. Estas capas son cinco
     en total contando las dos de arriba, asi que destapando de a una con
     tope de 3 el click NO entra, y destapandolas todas de una si. */
  .capa { position: relative; }
  .capa::before {
    content: ''; position: absolute; inset: 0; z-index: 41;
  }

  /* ---- ?tapa=recorte: el toggle NO aparece en su propia pila ----
     No lo tapa nada: esta RECORTADO, asi que el punto que Playwright
     clickea (su centro) no le pertenece y contesta el primer ancestro que
     si es hit-testable. Hasta el 2026-08-05 eso se leia igual que "lo tapa
     un ancestro" y mandaba a destapar capas para siempre, que es
     justamente lo que no arregla este caso.

     clip-path y no overflow a proposito: no genera contenedor scrolleable,
     asi que el scrollIntoView de clickear() no lo puede deshacer, y no
     cambia la caja del elemento — la posicion del click sigue siendo la
     misma. Es el caso "no hay nada que destapar ni a donde correrse". */
  .recortado { clip-path: inset(0 100% 0 0); }

  /* La perilla del switch: en el portal real el handler vive ACA ADENTRO,
     no en el <label>. Tiene que cubrir el label entero para que un click de
     verdad en el centro le pegue a ella. */
  .perilla { position: absolute; inset: 0; border-radius: 12px; }
</style>

<div data-testid="collapsible-panel-header" role="button">Bebidas</div>
<div id="lista"></div>

<!-- Punto 3: el mismo texto del radio, presente en el DOM desde el vamos y
     escondido. Sin filtrar por visible, get_by_text(...).first agarra este. -->
<div class="fantasma" data-testid="test-typography">Sólo por hoy</div>

<!-- Punto 1: la franja, siempre presente, tapando la lista entera. -->
<div class="sc-QzmmP fibAA" data-testid="menu-categories-hoverable-gap-5"></div>

<script>
// ?gap=no          saca la franja, para poder comparar con y sin ella.
// ?dialogo=portal  el dialogo del 2026-08-03: portal de floating-ui, con
//                  opciones por data-testid y el texto SIN tilde.
// ?tapa=ancestro   lo del 2026-08-05: el que tapa el toggle es un ANCESTRO
//                  suyo, y el popup se abre solo con pointerdown sobre la
//                  perilla de adentro del <label>. Implica ?dialogo=portal,
//                  que es el dialogo que tiene el portal de verdad.
// ?tapa=muchos    igual que ancestro pero con MAS capas decorativas que el
//                 limite de 3 que tenia el destapado viejo.
// ?tapa=recorte   el toggle no aparece en su propia pila: no lo tapa nada,
//                 esta recortado y su centro no le pertenece.
// ?dialogo=invisible  lo del 2026-08-07: el popup se abre —las 3 opciones
//                 estan en el DOM— pero el portal sigue en visibility:hidden
//                 porque floating-ui todavia no lo posiciono, asi que para
//                 Playwright no existe. El modal de confirmar que viene
//                 despues monta igual de invisible.
// ?dialogo=tarde  el otro medio del mismo log: el popup monta, pero recien a
//                 los 14 s, pasado el limite viejo de 10.
const params = new URLSearchParams(location.search);
const CON_GAP = params.get("gap") !== "no";
const TAPA = params.get("tapa") || "";
const TAPA_MUCHOS = TAPA === "muchos";
const TAPA_RECORTE = TAPA === "recorte";
// Los tres arman la misma jerarquia de ancestros del portal real.
const TAPA_ANCESTRO = TAPA === "ancestro" || TAPA_MUCHOS || TAPA_RECORTE;
const DIALOGO = params.get("dialogo") || "";
const DIALOGO_INVISIBLE = DIALOGO === "invisible";
const DIALOGO_TARDE = DIALOGO === "tarde";
// Los dos nuevos son variantes del portal de floating-ui, que es el dialogo
// que tiene el portal de verdad.
const DIALOGO_PORTAL = DIALOGO === "portal" || DIALOGO_INVISIBLE ||
                       DIALOGO_TARDE || TAPA_ANCESTRO;
const DEMORA_OPCIONES = DIALOGO_TARDE ? 14000 : 1200;
if (!CON_GAP) {
  document.querySelector('[data-testid^="menu-categories-hoverable-gap"]').remove();
}

// [nombre, id de producto, extra]
//   extra="rotulo"  -> el nombre aparece DOS VECES en la misma tarjeta.
//                      Inofensivo: las dos llevan al mismo producto.
const PRODUCTOS = [
  ["Villavicencio con gas 500 ml", "582221", ""],
  ["Villavicencio sin gas 500 ml", "582222", ""],
  // El nombre repetido dentro de la propia tarjeta.
  ["Gaseosa cola 500 ml", "582223", "rotulo"],
  // LA TRAMPA DEL PUNTO 4: dos productos distintos, mismo nombre exacto.
  ["Agua con gas", "1148962", ""],
  ["Agua con gas", "1148963", ""],
];

const apagados = new Set(JSON.parse(localStorage.getItem("apagados") || "[]"));
const guardar = () =>
  localStorage.setItem("apagados", JSON.stringify([...apagados]));

// Donde van las tarjetas. Con ?tapa=ancestro se envuelven en el
// <ul data-testid="menu-categories"> / <li data-testid="menu-category"> del
// portal real, que son ANCESTROS del toggle: sin esa jerarquia no hay forma
// de reproducir el "encima=ul[data-testid=menu-categories]" del log.
function contenedor() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  if (!TAPA_ANCESTRO) return lista;

  const ul = document.createElement("ul");
  ul.setAttribute("data-testid", "menu-categories");
  const li = document.createElement("li");
  li.setAttribute("data-testid", "menu-category");
  const cuerpo = document.createElement("div");
  cuerpo.className = "cat-cuerpo";
  li.appendChild(cuerpo);
  ul.appendChild(li);
  lista.appendChild(ul);
  if (!TAPA_MUCHOS) return cuerpo;

  // Tres capas mas, cada una con su propio pseudo-elemento por encima. Con
  // el <ul> y .cat-cuerpo son cinco ancestros tapando el mismo toggle: mas
  // que las 3 que el destapado viejo podia sacar.
  let dentro = cuerpo;
  for (let i = 0; i < 3; i++) {
    const capa = document.createElement("div");
    capa.className = "capa";
    dentro.appendChild(capa);
    dentro = capa;
  }
  return dentro;
}

function pintar() {
  const lista = contenedor();
  PRODUCTOS.forEach(([nombre, pid, extra], i) => {
    const apagado = apagados.has(pid);
    const tarjeta = document.createElement("div");
    tarjeta.className = "tarjeta";
    // La foto: es de donde listar_productos() saca los nombres.
    const img = document.createElement("img");
    img.setAttribute("data-testid", "catalog-item-image");
    img.alt = nombre;
    img.width = 28; img.height = 28;
    img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
    tarjeta.appendChild(img);

    const n = document.createElement("div");
    n.className = "nombre";
    n.textContent = nombre;
    tarjeta.appendChild(n);

    if (extra === "rotulo") {
      // El MISMO texto exacto, otra vez, dentro de la misma tarjeta.
      const r = document.createElement("div");
      r.className = "rotulo";
      r.textContent = nombre;
      tarjeta.appendChild(r);
    }

    if (apagado) {
      const badge = document.createElement("span");
      badge.textContent = "Apagados";
      tarjeta.appendChild(badge);
    }

    const label = document.createElement("label");
    label.setAttribute(
      "data-testid", `menu-category-101536-product-${pid}-availability-switch-control`);
    // CONFIRMADO POR LOG (2026-08-05): el label del portal trae este for= y
    // TODOS los productos tienen un input con ese mismo id. El for= resuelve
    // al primero del documento, asi que activar el label por JS puede tocar
    // el switch de OTRO producto. Esta aca para que la prueba lo cubra.
    label.setAttribute("for", "switch-hidden-input");
    label.className = "sc-iYsgxs" + (apagado ? "" : " on");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = "switch-hidden-input";
    input.checked = !apagado;
    input.readOnly = true;
    label.appendChild(input);

    // preventDefault: el estado del switch lo maneja el portal (React), no
    // la activacion nativa del <input>. Sin esto, abrir el dialogo y
    // cancelar dejaba el checkbox tildado al reves de lo que el portal
    // cree, y leer_estado() contestaba "apagado" un producto que seguia
    // prendido: un bug de la replica que no existe en el portal real.
    // Es tambien lo que evita que el for= de arriba active el input ajeno.
    label.addEventListener("click", (e) => e.preventDefault());

    if (TAPA_ANCESTRO) {
      // EL BUG DEL 2026-08-05: el handler vive en la perilla de ADENTRO y
      // escucha pointerdown, no click. Un .click() disparado sobre el
      // <label> no lo despierta (los eventos suben, no bajan) y ademas no
      // manda pointerdown: por eso el popup no se abria NUNCA.
      const perilla = document.createElement("span");
      perilla.className = "perilla";
      perilla.addEventListener("pointerdown", () => togglear(pid, nombre));
      label.appendChild(perilla);
    } else {
      label.addEventListener("click", () => togglear(pid, nombre));
    }
    if (TAPA_RECORTE) {
      // El toggle queda recortado: se sigue midiendo igual (clip-path no
      // cambia la caja) pero su centro ya no le pertenece en el hit test.
      const recorte = document.createElement("div");
      recorte.className = "recortado";
      recorte.appendChild(label);
      tarjeta.appendChild(recorte);
    } else {
      tarjeta.appendChild(label);
    }

    lista.appendChild(tarjeta);
  });
}

function togglear(pid, nombre) {
  if (apagados.has(pid)) {
    // Prender no abre ningun dialogo (confirmado en vivo, op#18).
    apagados.delete(pid);
    guardar();
    pintar();
    return;
  }
  abrirModal(pid);
}

// El modal NO monta el radio de una: el log mostro que al buscarlo solo
// existia el fantasma. Aca se reproduce con un retardo.
function abrirModal(pid) {
  // Un <label> con un <input> adentro dispara el click DOS veces (el
  // segundo por la activacion del input). Es de la replica, no del portal:
  // sin esta guarda se apilaban dos modales identicos y el de arriba
  // tapaba al de abajo, que no es lo que se quiere probar aca.
  if (document.querySelector(".modal") ||
      document.querySelector("[data-floating-ui-portal]")) return;

  if (DIALOGO_PORTAL) return abrirPopupFlotante(pid);

  const fondo = document.createElement("div");
  fondo.className = "portal portal6";
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = '<b>Elegí hasta cuándo</b>';
  document.body.appendChild(fondo);
  document.body.appendChild(modal);

  setTimeout(() => {
    for (const txt of ["No disponible indefinidamente", "Sólo por hoy"]) {
      const op = document.createElement("div");
      op.setAttribute("data-testid", "test-typography");
      op.textContent = txt;
      op.addEventListener("click", () => confirmar(pid, fondo, modal));
      modal.appendChild(op);
    }
  }, 1200);
}

// El dialogo REAL del 2026-08-03: un portal de floating-ui pegado al
// toggle. Tres cosas que rompian el codigo viejo:
//   - no es [role=dialog] ni un overlay de Angular, asi que texto_overlay()
//     contestaba "(nada)" con el dialogo abierto adelante;
//   - el texto de la opcion no es el nuestro caracter por caracter
//     ("Solo por hoy", sin tilde, y con una aclaracion abajo);
//   - queda ABIERTO y tapando la pantalla, asi que el intento siguiente
//     falla por una razon distinta.
function abrirPopupFlotante(pid) {
  const portal = document.createElement("div");
  portal.setAttribute("data-floating-ui-portal", "");
  portal.className = "portal-flotante";

  const popup = document.createElement("div");
  popup.className = "popup";
  portal.appendChild(popup);
  // floating-ui monta el portal invisible y lo revela recien cuando lo
  // posiciono. Con ?dialogo=invisible se queda asi para siempre: es lo que
  // pasa cuando la pestaña esta de fondo y Chrome no corre el rendering.
  if (DIALOGO_INVISIBLE) portal.style.visibility = "hidden";
  document.body.appendChild(portal);

  const cerrar = e => {
    if (e.key === "Escape") {
      portal.remove();
      document.removeEventListener("keydown", cerrar);
    }
  };
  document.addEventListener("keydown", cerrar);

  setTimeout(() => {
    const OPCIONES = [
      ["No disponible indefinidamente", "Hasta que lo vuelvas a prender"],
      // SIN TILDE a proposito, y con segunda linea: es lo que hacia que el
      // get_by_text(exact=True) no encontrara nada.
      ["Solo por hoy", "Se reactiva mañana a la mañana"],
      ["Personalizar disponibilidad", "Elegí una fecha"],
    ];
    OPCIONES.forEach(([titulo, aclaracion], i) => {
      const op = document.createElement("div");
      op.setAttribute("data-testid",
                      `menu-item-availability-switch-option-${i + 1}`);
      op.innerHTML = `<div>${titulo}</div>` +
                     `<div class="rotulo">${aclaracion}</div>`;
      op.addEventListener("click", () => {
        document.removeEventListener("keydown", cerrar);
        portal.remove();
        const fondo = document.createElement("div");
        fondo.className = "portal portal6";
        const modal = document.createElement("div");
        modal.className = "modal";
        // El segundo modal se monta igual que el popup: si aquel era
        // invisible, este tambien. Es el caso que convierte a este modal en
        // el cuello siguiente apenas el popup empieza a funcionar.
        if (DIALOGO_INVISIBLE) modal.style.visibility = "hidden";
        document.body.appendChild(fondo);
        document.body.appendChild(modal);
        // "Personalizar" no apaga nada: pide una fecha. Si el codigo elige
        // por posicion en vez de por texto, esta prueba lo tiene que ver.
        if (titulo.startsWith("Personalizar")) {
          modal.innerHTML = "<b>Elegí hasta qué fecha</b>";
          return;
        }
        confirmar(pid, fondo, modal);
      });
      popup.appendChild(op);
    });
  }, DEMORA_OPCIONES);
}

function confirmar(pid, fondo, modal) {
  modal.innerHTML = "<b>¿Desactivar producto?</b>";
  const btn = document.createElement("button");
  btn.textContent = "Sí, desactivar";
  btn.addEventListener("click", () => {
    apagados.add(pid);
    guardar();
    fondo.remove();
    modal.remove();
    pintar();
  });
  const cancelar = document.createElement("button");
  cancelar.textContent = "Cancelar";
  modal.appendChild(btn);
  modal.appendChild(cancelar);
}

pintar();
</script>
